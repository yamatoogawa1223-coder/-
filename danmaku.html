<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>弾幕シューティング 星屑の夜</title>
<style>
  html,body{margin:0;height:100%;background:#05030c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;box-shadow:0 0 40px #4a2bff55;touch-action:none}
  #touch{position:fixed;right:12px;bottom:14px;display:none;flex-direction:column;gap:14px;z-index:2}
  .btn{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);color:#fff;font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
  .btn.on{background:rgba(255,255,255,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="btn" data-k="bomb">BOMB</div>
  <div class="btn" data-k="focus">低速</div>
</div>
<script>
'use strict';
// ====== 基本設定 ======
const W = 480, H = 640;
const cv = document.getElementById('game');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

const DIFF = [
  { name: 'EASY',    spd: 0.8, dens: 0.65 },
  { name: 'NORMAL',  spd: 1.0, dens: 1.0 },
  { name: 'HARD',    spd: 1.2, dens: 1.35 },
];
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);

// ====== サウンド ======
let actx = null, muted = false, lastSe = {};
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(f, d, type = 'square', vol = 0.05, slide = 0, key) {
  if (!actx || muted) return;
  const now = actx.currentTime;
  if (key) { if (lastSe[key] && now - lastSe[key] < 0.05) return; lastSe[key] = now; }
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), now + d);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now + d);
}
const se = {
  shot: () => tone(900, 0.04, 'square', 0.012, -300, 'shot'),
  kill: () => tone(300, 0.15, 'sawtooth', 0.05, -220, 'kill'),
  item: () => tone(1200, 0.06, 'triangle', 0.05, 500, 'item'),
  graze: () => tone(2000, 0.02, 'sine', 0.02, 0, 'graze'),
  hit: () => tone(200, 0.6, 'sawtooth', 0.09, -170),
  bomb: () => tone(120, 0.9, 'sawtooth', 0.09, 500),
  boss: () => tone(500, 0.5, 'triangle', 0.07, -300),
  clear: () => { tone(660, 0.15, 'square', 0.06); setTimeout(() => tone(880, 0.3, 'square', 0.06), 150); },
};

// ====== 入力 ======
const input = { l: 0, r: 0, u: 0, d: 0, focus: 0, bomb: 0, shoot: 0 };
let bombReq = false, pressReq = false, menuMove = 0;
const KEYMAP = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd',
  ShiftLeft: 'focus', ShiftRight: 'focus',
};
addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'KeyX' || e.code === 'KeyB') { if (!e.repeat) bombReq = true; }
  if (e.code === 'Enter' || e.code === 'KeyZ' || e.code === 'Space') { if (!e.repeat) pressReq = true; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) togglePause(); }
  if (e.code === 'KeyM') muted = !muted;
  if (state === 'title' && !e.repeat) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') menuMove = -1;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') menuMove = 1;
  }
  const k = KEYMAP[e.code]; if (k) input[k] = 1;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = 0; });
addEventListener('blur', () => { for (const k in input) input[k] = 0; });

// タッチ / マウス（ドラッグで自機を移動）
let drag = null;
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = toCanvas(e);
  if (state === 'title') {
    for (let i = 0; i < 3; i++) if (Math.abs(p.y - (400 + i * 46)) < 22) { diff = i; break; }
    pressReq = true; return;
  }
  if (state === 'over' || state === 'clear') { pressReq = true; return; }
  if (state === 'paused') { togglePause(); return; }
  cv.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, sx: p.x, sy: p.y, px: player.x, py: player.y };
  touchUsed = e.pointerType !== 'mouse';
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play') return;
  const p = toCanvas(e);
  player.x = clamp(drag.px + (p.x - drag.sx), 12, W - 12);
  player.y = clamp(drag.py + (p.y - drag.sy), 20, H - 20);
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
let touchUsed = false;
if (matchMedia('(pointer: coarse)').matches) document.getElementById('touch').style.display = 'flex';
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); b.classList.add('on'); if (k === 'bomb') bombReq = true; else input.focus = 1; });
  const off = () => { b.classList.remove('on'); if (k === 'focus') input.focus = 0; };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ====== スプライト（弾） ======
const sprCache = {};
function bulletSprite(col, r) {
  const key = col + r;
  if (sprCache[key]) return sprCache[key];
  const s = Math.ceil(r * 2 + 8), c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d'), m = s / 2;
  const gr = g.createRadialGradient(m, m, r * 0.3, m, m, r + 3);
  gr.addColorStop(0, col); gr.addColorStop(0.7, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(m, m, r + 3, 0, TAU); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(m, m, r * 0.62, 0, TAU); g.fill();
  return sprCache[key] = c;
}

// ====== ゲーム状態 ======
let state = 'title', diff = 1, stateT = 0, t = 0;
let score = 0, hiscore = 0, graze = 0;
try { hiscore = +localStorage.getItem('danmaku_hi') || 0; } catch (e) {}
let player, bullets, pshots, enemies, items, fx, boss, popups, stars;
let bombT = 0, shake = 0, banner = null;

function togglePause() {
  if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play';
}

function newGame() {
  score = 0; graze = 0; t = 0; bombT = 0; shake = 0; banner = null;
  player = { x: W / 2, y: H - 90, lives: 3, bombs: 3, power: 0, inv: 120, dying: 0, fire: 0, hitFlash: 0 };
  bullets = []; pshots = []; enemies = []; items = []; fx = []; popups = []; boss = null;
  stars = Array.from({ length: 70 }, () => ({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.3, 2.2) }));
  waveIdx = 0;
  state = 'play'; stateT = 0;
}

// ====== 弾生成 ======
function eb(x, y, ang, sp, col = '#ff4d6d', r = 5, o) {
  const d = DIFF[diff];
  const b = { x, y, sp: sp * d.spd, ang, r, col, grazed: false };
  if (o) Object.assign(b, o);
  bullets.push(b);
  return b;
}
const toPlayer = (x, y) => Math.atan2(player.y - y, player.x - x);
const cnt = n => Math.max(1, Math.round(n * DIFF[diff].dens));
function ring(x, y, n, off, sp, col, r, o) { n = cnt(n); for (let i = 0; i < n; i++) eb(x, y, off + i * TAU / n, sp, col, r, o); }
function fan(x, y, n, spread, sp, col, r, o) {
  n = cnt(n);
  const a = toPlayer(x, y);
  for (let i = 0; i < n; i++) eb(x, y, a + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spread), sp, col, r, o);
}

// ====== 敵 ======
function spawn(o) {
  const e = Object.assign({ x: 0, y: -30, vx: 0, vy: 2, hp: 6, maxhp: 6, r: 14, t: 0, col: '#7dd3fc', score: 200, stopY: null, stay: 0, fire: null, big: false, drop: 1 }, o);
  e.maxhp = e.hp;
  enemies.push(e);
  return e;
}
const P_ = { A: '#7dd3fc', B: '#f9a8d4', C: '#fde047', D: '#86efac' };

let waveIdx = 0;
const WAVES = [
  [60, () => { for (let i = 0; i < 6; i++) setTimeout(() => state === 'play' && spawn({ x: 30, y: -20, vx: 1.6, vy: 1.7, hp: 5, col: P_.A,
      fire: e => { if (e.t % 70 === 30) fan(e.x, e.y, 1, 0, 3, '#ff6b81', 5); } }), i * 380); }],
  [420, () => { for (let i = 0; i < 6; i++) setTimeout(() => state === 'play' && spawn({ x: W - 30, y: -20, vx: -1.6, vy: 1.7, hp: 5, col: P_.B,
      fire: e => { if (e.t % 70 === 30) fan(e.x, e.y, 3, 0.5, 3, '#ffb347', 5); } }), i * 380); }],
  [900, () => { [110, 240, 370].forEach((x, i) => spawn({ x, y: -30, vy: 2, stopY: 110 + (i === 1 ? 40 : 0), stay: 420, hp: 34, r: 20, big: true, col: P_.C, score: 800, drop: 3,
      fire: e => { if (e.t > 40 && e.t % 55 === 0) ring(e.x, e.y, 14, e.t * 0.1, 2.2, '#60a5fa', 5); } })); }],
  [1500, () => { for (let i = 0; i < 9; i++) setTimeout(() => state === 'play' && spawn({ x: 60 + (i % 3) * 180, y: -20, vy: 2.2, vx: 0, hp: 5, col: P_.D,
      fire: e => { e.vx = Math.sin(e.t * 0.06 + i) * 1.6; if (e.t % 60 === 20) fan(e.x, e.y, 5, 0.9, 3.2, '#a3e635', 4); } }), i * 260); }],
  [2200, () => { [140, 340].forEach((x, i) => spawn({ x, y: -30, vy: 2, stopY: 150, stay: 500, hp: 60, r: 22, big: true, col: P_.B, score: 1500, drop: 4,
      fire: e => { if (e.t > 40 && e.t % 4 === 0) { const a = e.t * 0.12 * (i ? -1 : 1); eb(e.x, e.y, a, 2.4, i ? '#f472b6' : '#38bdf8', 4); if (DIFF[diff].dens > 1) eb(e.x, e.y, a + Math.PI, 2.4, i ? '#f472b6' : '#38bdf8', 4); } } })); }],
];
const BOSS_TIME = 3300;

function killEnemy(e) {
  score += e.score; se.kill();
  burst(e.x, e.y, e.col, e.big ? 26 : 12);
  for (let i = 0; i < e.drop; i++) items.push({ x: e.x + rnd(-14, 14), y: e.y + rnd(-10, 10), vy: -2.5, type: (i === 0 && Math.random() < 0.7) || player.power >= 4 && Math.random() < 0.2 ? 'S' : 'P', t: 0 });
  if (!e.dropFix) {}
}

// ====== ボス ======
const PHASES = [
  { name: null, hp: 320, time: 1800, fn(b, f) {
      if (f % 50 === 20) fan(b.x, b.y, 5, 0.8, 3, '#ff6b81', 5);
      if (f % 90 === 60) ring(b.x, b.y, 22, f * 0.05, 2.2, '#c084fc', 5);
      if (f % 110 === 0) b.tx = rnd(120, W - 120);
  } },
  { name: '符「螺旋の花弁」', hp: 480, time: 2400, fn(b, f) {
      if (f > 30 && f % 5 === 0) { const n = cnt(3); for (let k = 0; k < n; k++) eb(b.x, b.y, f * 0.11 + k * TAU / n, 2.3, k % 2 ? '#f472b6' : '#fb7185', 5); }
      if (f % 130 === 100) fan(b.x, b.y, 7, 1.2, 4, '#fde047', 4);
      if (f % 160 === 0) b.tx = rnd(140, W - 140);
  } },
  { name: '幻符「夢幻の鎖」', hp: 560, time: 2700, fn(b, f) {
      if (f > 30 && f % 42 === 0) { const off = (f / 42 % 2) * Math.PI / 24; ring(b.x, b.y, 28, off, 3.6, f % 84 ? '#60a5fa' : '#22d3ee', 5, { acc: -0.045, min: 0.9 }); }
      if (f % 150 === 90) for (let i = 0; i < 6; i++) setTimeout(() => boss && state === 'play' && fan(boss.x, boss.y, 1, 0, 4.4, '#fde047', 4), i * 90);
      if (f % 140 === 0) b.tx = rnd(110, W - 110);
  } },
  { name: '終符「弾幕天蓋」', hp: 760, time: 3300, fn(b, f) {
      if (f > 40 && f % 4 === 0) {
        const a = f * 0.085, n = cnt(2);
        for (let k = 0; k < n; k++) {
          eb(b.x, b.y, a + k * Math.PI, 2.3, '#f472b6', 4);
          eb(b.x, b.y, -a * 0.8 + k * Math.PI, 2.0, '#38bdf8', 4);
        }
      }
      if (f % 7 === 0 && DIFF[diff].dens > 0.7) eb(rnd(10, W - 10), -6, Math.PI / 2, rnd(1.6, 2.6), '#a78bfa', 3);
      if (f > 60 && f % 210 === 0) ring(b.x, b.y, 16, rnd(0, 6), 1.3, '#fbbf24', 9);
      b.tx = W / 2 + Math.sin(f * 0.012) * 150;
  } },
];

function spawnBoss() {
  boss = { x: W / 2, y: -60, tx: W / 2, ty: 120, r: 26, phase: -1, hp: 1, maxhp: 1, f: 0, timer: 0, inv: 999, col: '#c4b5fd', t: 0 };
  banner = { txt: 'WARNING', sub: '', t: 0 };
  se.boss();
}
function nextPhase() {
  boss.phase++;
  if (boss.phase >= PHASES.length) return bossDefeated();
  const p = PHASES[boss.phase];
  boss.hp = boss.maxhp = p.hp; boss.f = 0; boss.timer = p.time; boss.inv = 70;
  boss.ty = 110; boss.tx = W / 2;
  if (p.name) { banner = { txt: p.name, sub: 'SPELL CARD', t: 0 }; se.boss(); }
}
function bulletsToItems() {
  for (const b of bullets) if (b.y > -20) fx.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 12, max: 12, col: b.col, r: 3 });
  bullets.length = 0;
}
function phaseEnd(captured) {
  bulletsToItems();
  burst(boss.x, boss.y, boss.col, 40); shake = 12; se.kill();
  const ph = PHASES[boss.phase];
  if (captured && ph.name) {
    const bonus = Math.round(10000 * (boss.timer / ph.time) / 10) * 10 + 3000;
    score += bonus; popups.push({ x: W / 2, y: 260, txt: 'SPELL BONUS +' + bonus, t: 0 });
  }
  score += 5000;
  for (let i = 0; i < 8; i++) items.push({ x: boss.x + rnd(-30, 30), y: boss.y + rnd(-20, 20), vy: -2.5, type: i < 3 ? 'P' : 'S', t: 0 });
  nextPhase();
}
function bossDefeated() {
  boss = null;
  bulletsToItems();
  shake = 30; se.clear();
  for (let i = 0; i < 6; i++) setTimeout(() => burst(rnd(120, 360), rnd(60, 200), '#fde047', 30), i * 120);
  const bonus = player.lives * 20000 + player.bombs * 5000 + graze * 10;
  score += bonus;
  state = 'clear'; stateT = 0; clearBonus = bonus;
  saveHi();
}
let clearBonus = 0;
function saveHi() { if (score > hiscore) { hiscore = score; try { localStorage.setItem('danmaku_hi', hiscore); } catch (e) {} } }

// ====== エフェクト ======
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(1, 5);
    fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(18, 40), max: 40, col, r: rnd(2, 4) });
  }
}

// ====== 更新 ======
function hitPlayer() {
  if (player.inv > 0 || player.dying > 0) return;
  player.dying = 12; // ここでボムを押せば被弾を取り消せる（喰らいボム）
}
function useBomb() {
  if (player.bombs <= 0 || bombT > 0) return false;
  player.bombs--; bombT = 150; player.inv = Math.max(player.inv, 200); player.dying = 0;
  se.bomb(); shake = 10;
  return true;
}
function die() {
  player.dying = 0; player.lives--; se.hit(); shake = 16;
  burst(player.x, player.y, '#fff', 30);
  // 被弾時にアイテムを散らす
  const lost = Math.min(2, player.power);
  player.power -= lost;
  for (let i = 0; i < lost; i++) items.push({ x: player.x + rnd(-30, 30), y: player.y - 20, vy: -3, type: 'P', t: 0 });
  bullets.length = 0;
  if (player.lives < 0) { state = 'over'; stateT = 0; saveHi(); return; }
  player.x = W / 2; player.y = H - 90; player.inv = 180; player.bombs = Math.max(player.bombs, 3);
}

function playerShoot() {
  const p = player;
  if (p.fire-- > 0) return;
  p.fire = 4;
  const f = input.focus, lv = p.power;
  const streams = [[0, 0]];
  if (lv >= 1) streams.push([-9, f ? 0 : -0.06], [9, f ? 0 : 0.06]);
  if (lv >= 2) streams.push([-18, f ? 0 : -0.14], [18, f ? 0 : 0.14]);
  if (lv >= 3) streams.push([-27, f ? 0 : -0.24], [27, f ? 0 : 0.24]);
  if (lv >= 4) streams.push([-4, f ? 0 : -0.03], [4, f ? 0 : 0.03]);
  for (const [dx, da] of streams) pshots.push({ x: p.x + dx, y: p.y - 14, vx: Math.sin(da) * 14, vy: -Math.cos(da) * 14, dmg: 1 });
  se.shot();
}

function damageEnemy(e, d) {
  e.hp -= d; e.flash = 3;
}

function update() {
  t++;
  const p = player;
  // --- 自機
  const sp = input.focus ? 2.1 : 4.6;
  let dx = input.r - input.l, dy = input.d - input.u;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  p.x = clamp(p.x + dx * sp, 12, W - 12); p.y = clamp(p.y + dy * sp, 20, H - 20);
  if (p.inv > 0) p.inv--;
  if (p.dying > 0) { if (bombReq && useBomb()) {} else if (--p.dying === 0) die(); }
  else if (bombReq) useBomb();
  bombReq = false;
  if (state !== 'play') return;
  playerShoot();
  if (bombT > 0) bombT--;

  // --- 背景スクロール
  for (const s of stars) { s.y += s.z * 1.6; if (s.y > H) { s.y = 0; s.x = rnd(0, W); } }

  // --- ウェーブ
  while (!boss && waveIdx < WAVES.length && t >= WAVES[waveIdx][0]) WAVES[waveIdx++][1]();
  if (!boss && t === BOSS_TIME) spawnBoss();

  // --- 自機弾
  for (let i = pshots.length - 1; i >= 0; i--) {
    const s = pshots[i]; s.x += s.vx; s.y += s.vy;
    let dead = s.y < -20 || s.x < -20 || s.x > W + 20;
    if (!dead) {
      for (const e of enemies) if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 4) { damageEnemy(e, s.dmg); dead = true; score += 10; break; }
    }
    if (!dead && boss && Math.hypot(boss.x - s.x, boss.y - s.y) < boss.r + 6) {
      if (boss.inv <= 0) { boss.hp -= s.dmg; score += 10; boss.flash = 3; }
      dead = true;
    }
    if (dead) { pshots[i] = pshots[pshots.length - 1]; pshots.pop(); }
  }

  // --- 敵
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t++;
    if (e.flash > 0) e.flash--;
    if (e.stopY !== null && e.vy > 0 && e.y >= e.stopY) { e.vy = 0; e.stayT = 0; }
    if (e.stopY !== null && e.vy === 0) { if (++e.stayT > e.stay) { e.vy = -1.6; e.stopY = null; } }
    if (e.fire) e.fire(e);
    e.x += e.vx; e.y += e.vy;
    if (e.hp <= 0) { killEnemy(e); enemies.splice(i, 1); continue; }
    if (e.y < -60 || e.y > H + 40 || e.x < -50 || e.x > W + 50) { if (e.t > 30) enemies.splice(i, 1); continue; }
    if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + 3) hitPlayer();
  }

  // --- ボス
  if (boss) {
    const b = boss; b.t++;
    if (b.flash > 0) b.flash--;
    if (b.phase === -1) {
      b.y += (b.ty - b.y) * 0.05;
      if (b.t > 90) nextPhase();
    } else {
      b.x += (clamp(b.tx, 80, W - 80) - b.x) * 0.03;
      b.y += (b.ty - b.y) * 0.05;
      if (b.inv > 0) b.inv--;
      else {
        b.f++; b.timer--;
        PHASES[b.phase].fn(b, b.f);
        if (b.hp <= 0) phaseEnd(true);
        else if (b.timer <= 0) phaseEnd(false);
      }
      if (boss && Math.hypot(b.x - p.x, b.y - p.y) < b.r + 3) hitPlayer();
    }
  }

  // --- ボム
  if (bombT > 0) {
    const prog = 1 - bombT / 150, rad = 60 + prog * 520;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (Math.hypot(b.x - p.x, b.y - p.y) < rad) { fx.push({ x: b.x, y: b.y, vx: 0, vy: -1, life: 10, max: 10, col: b.col, r: 3 }); bullets[i] = bullets[bullets.length - 1]; bullets.pop(); score += 5; }
    }
    for (const e of enemies) damageEnemy(e, 1.2);
    if (boss && boss.inv <= 0 && boss.phase >= 0) { boss.hp -= 1.3; boss.flash = 2; }
    if (t % 3 === 0) fx.push({ x: p.x + rnd(-40, 40), y: p.y + rnd(-40, 40), vx: rnd(-2, 2), vy: rnd(-4, -1), life: 30, max: 30, col: '#a5f3fc', r: 4 });
  }

  // --- 敵弾
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.acc) { b.sp += b.acc; if (b.acc < 0 && b.sp < b.min) b.sp = b.min; }
    if (b.w) b.ang += b.w;
    b.x += Math.cos(b.ang) * b.sp; b.y += Math.sin(b.ang) * b.sp;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { bullets[i] = bullets[bullets.length - 1]; bullets.pop(); continue; }
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < b.r + 2.4) { hitPlayer(); if (p.dying === 12) { bullets[i] = bullets[bullets.length - 1]; bullets.pop(); } }
    else if (!b.grazed && d < b.r + 16 && p.dying === 0) { b.grazed = true; graze++; score += 30; se.graze(); fx.push({ x: p.x, y: p.y, vx: rnd(-2, 2), vy: rnd(-2, 2), life: 8, max: 8, col: '#fff', r: 1.5 }); }
  }

  // --- アイテム
  const poc = p.y < 200 && p.dying === 0;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.t++;
    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if (poc || d < 60 || it.homing) {
      it.homing = true; const a = Math.atan2(p.y - it.y, p.x - it.x); it.x += Math.cos(a) * 9; it.y += Math.sin(a) * 9;
    } else { it.vy = Math.min(it.vy + 0.08, 2.2); it.y += it.vy; }
    if (d < 16 && p.dying === 0) {
      if (it.type === 'P') { if (p.power < 4) { p.power++; popups.push({ x: p.x, y: p.y - 20, txt: 'POWER UP', t: 0 }); } else score += 1000; }
      else score += 500;
      score += 100; se.item(); items.splice(i, 1); continue;
    }
    if (it.y > H + 20) items.splice(i, 1);
  }

  // --- エフェクト
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.x += f.vx; f.y += f.vy; f.vx *= 0.96; f.vy *= 0.96; if (--f.life <= 0) fx.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { const q = popups[i]; q.t++; q.y -= 0.4; if (q.t > 70) popups.splice(i, 1); }
  if (banner && ++banner.t > 130) banner = null;
  if (shake > 0) shake *= 0.9;
  if (score > hiscore) hiscore = score;
}

// ====== 描画 ======
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0620'); g.addColorStop(0.6, '#14103a'); g.addColorStop(1, '#251650');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.z * 0.3; ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.z > 1.5 ? 2 : 1, s.z * 3 + 1);
  }
  ctx.globalAlpha = 1;
}
function drawPlayer() {
  const p = player;
  if (p.dying > 0) return;
  if (p.inv > 0 && Math.floor(t / 3) % 2) ctx.globalAlpha = 0.4;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = '#e0f2fe';
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(0, 6); ctx.lineTo(-11, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(4, 6); ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,180,80,.9)'; ctx.fillRect(-2, 8, 4, 4 + (t % 4));
  ctx.restore(); ctx.globalAlpha = 1;
  if (input.focus || touchUsed) {
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, TAU); ctx.stroke();
  }
  if (input.focus) { ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, TAU); ctx.fill(); }
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.flash ? '#fff' : e.col;
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(-e.r * 0.9, 0, e.r * 0.7, e.r * 0.4, -0.5, 0, TAU); ctx.ellipse(e.r * 0.9, 0, e.r * 0.7, e.r * 0.4, 0.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, 0, e.r * 0.8, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#1e1b4b'; ctx.beginPath(); ctx.arc(-4, -2, 2, 0, TAU); ctx.arc(4, -2, 2, 0, TAU); ctx.fill();
  if (e.big) { ctx.strokeStyle = '#fff8'; ctx.beginPath(); ctx.arc(0, 0, e.r + 4 + Math.sin(e.t * 0.1) * 2, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
function drawBoss() {
  const b = boss;
  ctx.save(); ctx.translate(b.x, b.y);
  const pulse = Math.sin(t * 0.08) * 3;
  ctx.strokeStyle = 'rgba(196,181,253,.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, b.r + 12 + i * 8 + pulse, t * 0.02 * (i % 2 ? -1 : 1), t * 0.02 * (i % 2 ? -1 : 1) + 4.2); ctx.stroke(); }
  ctx.fillStyle = b.flash ? '#fff' : '#a78bfa';
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ede9fe'; ctx.beginPath(); ctx.arc(0, -4, b.r * 0.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4c1d95'; ctx.beginPath(); ctx.arc(-6, -6, 3, 0, TAU); ctx.arc(6, -6, 3, 0, TAU); ctx.fill();
  ctx.restore();
  if (b.phase >= 0) {
    // HP バー
    const bw = W - 120, bx = 60, by = 40, ratio = clamp(b.hp / b.maxhp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 8);
    ctx.fillStyle = PHASES[b.phase].name ? '#fb7185' : '#a5f3fc'; ctx.fillRect(bx, by, bw * ratio, 4);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.max(0, Math.ceil(b.timer / 60)), W - 14, by + 4);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c4b5fd'; ctx.fillText('★'.repeat(PHASES.length - 1 - b.phase), 14, by + 4);
    if (PHASES[b.phase].name && b.inv <= 0) { ctx.fillStyle = '#fda4af'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(PHASES[b.phase].name, W - 10, by + 24); ctx.textAlign = 'left'; }
  }
}
function drawBomb() {
  const prog = 1 - bombT / 150, rad = 60 + prog * 520;
  const g = ctx.createRadialGradient(player.x, player.y, rad * 0.6, player.x, player.y, rad);
  g.addColorStop(0, 'rgba(120,220,255,0)'); g.addColorStop(0.85, 'rgba(120,220,255,.25)'); g.addColorStop(1, 'rgba(255,255,255,.8)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(player.x, player.y, rad, 0, TAU); ctx.fill();
}
function txt(s, x, y, size, col = '#fff', align = 'left') {
  ctx.font = 'bold ' + size + 'px sans-serif'; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, H - 26, W, 26);
  txt('SCORE ' + String(score).padStart(9, '0'), 10, 18, 14);
  txt('HI ' + String(hiscore).padStart(9, '0'), W - 10, 18, 14, '#fde68a', 'right');
  txt('自機 ' + '★'.repeat(Math.max(0, player.lives)), 10, H - 8, 14, '#fda4af');
  txt('ボム ' + '◆'.repeat(player.bombs), 150, H - 8, 14, '#86efac');
  txt('POWER ' + (player.power >= 4 ? 'MAX' : player.power), 290, H - 8, 14, '#fde047');
  txt('GRAZE ' + graze, W - 10, H - 8, 14, '#a5f3fc', 'right');
}
function drawWorld() {
  drawBG();
  for (const it of items) {
    ctx.fillStyle = it.type === 'P' ? '#ef4444' : '#3b82f6';
    ctx.fillRect(it.x - 8, it.y - 8, 16, 16);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(it.x - 8, it.y - 8, 16, 16);
    txt(it.type, it.x, it.y + 5, 12, '#fff', 'center');
  }
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();
  ctx.globalAlpha = 0.85;
  for (const s of pshots) { ctx.fillStyle = '#bae6fd'; ctx.fillRect(s.x - 2, s.y - 8, 4, 14); }
  ctx.globalAlpha = 1;
  drawPlayer();
  if (bombT > 0) drawBomb();
  for (const b of bullets) { const s = bulletSprite(b.col, b.r); ctx.drawImage(s, b.x - s.width / 2, b.y - s.height / 2); }
  for (const f of fx) { ctx.globalAlpha = clamp(f.life / f.max, 0, 1); ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const q of popups) { ctx.globalAlpha = clamp(1 - q.t / 70, 0, 1); txt(q.txt, clamp(q.x, 70, W - 70), q.y, 14, '#fde047', 'center'); }
  ctx.globalAlpha = 1;
  if (banner) {
    const a = banner.t < 20 ? banner.t / 20 : banner.t > 100 ? (130 - banner.t) / 30 : 1;
    ctx.globalAlpha = clamp(a, 0, 1);
    if (banner.txt === 'WARNING') { ctx.fillStyle = 'rgba(200,0,0,.35)'; ctx.fillRect(0, 250, W, 70); txt('W A R N I N G', W / 2, 297, 34, '#fff', 'center'); }
    else { txt(banner.sub, W / 2, 250, 14, '#fda4af', 'center'); txt(banner.txt, W / 2, 285, 28, '#fff', 'center'); }
    ctx.globalAlpha = 1;
  }
  drawHUD();
  if (player.hitFlash > 0) {}
}
function overlayPanel(lines) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  lines.forEach(l => txt(l.s, W / 2, l.y, l.size, l.col || '#fff', 'center'));
}

function render() {
  ctx.save();
  if (shake > 0.5) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  if (state === 'title') {
    if (!stars) stars = Array.from({ length: 70 }, () => ({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.3, 2.2) }));
    for (const s of stars) { s.y += s.z * 1.6; if (s.y > H) { s.y = 0; s.x = rnd(0, W); } }
    drawBG();
    txt('星屑の夜', W / 2, 190, 64, '#e0e7ff', 'center');
    txt('S T A R D U S T   D A N M A K U', W / 2, 228, 16, '#a5b4fc', 'center');
    for (let i = 0; i < 3; i++) {
      const sel = i === diff;
      txt((sel ? '▶ ' : '') + DIFF[i].name, W / 2, 410 + i * 46, sel ? 28 : 22, sel ? '#fde047' : '#94a3b8', 'center');
    }
    txt('↑↓ 難易度 / Z・Enter・タップ でスタート', W / 2, 340, 14, '#e2e8f0', 'center');
    txt('移動: 矢印/WASD  低速: Shift  ボム: X  ポーズ: P  ミュート: M', W / 2, 560, 12, '#94a3b8', 'center');
    txt('スマホ: ドラッグで移動（ショットは自動）', W / 2, 582, 12, '#94a3b8', 'center');
    txt('HI-SCORE ' + hiscore, W / 2, 620, 14, '#fde68a', 'center');
  } else {
    drawWorld();
    if (state === 'paused') overlayPanel([{ s: 'PAUSE', y: 300, size: 40 }, { s: 'P / タップで再開', y: 340, size: 16, col: '#cbd5e1' }]);
    if (state === 'over') overlayPanel([{ s: 'GAME OVER', y: 280, size: 44, col: '#fb7185' }, { s: 'SCORE ' + score, y: 330, size: 22 }, { s: 'Z / タップでタイトルへ', y: 380, size: 16, col: '#cbd5e1' }]);
    if (state === 'clear') overlayPanel([{ s: 'STAGE CLEAR', y: 250, size: 44, col: '#fde047' }, { s: 'SCORE ' + score, y: 310, size: 24 }, { s: 'CLEAR BONUS +' + clearBonus, y: 345, size: 16, col: '#a5f3fc' }, { s: 'GRAZE ' + graze, y: 372, size: 16, col: '#a5f3fc' }, { s: 'Z / タップでタイトルへ', y: 430, size: 16, col: '#cbd5e1' }]);
  }
  ctx.restore();
}

// ====== メインループ（固定 60fps ステップ） ======
let last = 0, acc = 0;
function frame(ts) {
  acc += Math.min(100, ts - (last || ts)); last = ts;
  while (acc >= 1000 / 60) {
    acc -= 1000 / 60;
    if (state === 'title') {
      if (menuMove) { diff = (diff + menuMove + 3) % 3; menuMove = 0; }
      if (pressReq) { pressReq = false; initAudio(); newGame(); }
    } else if (state === 'play') update();
    else if (state === 'over' || state === 'clear') {
      stateT++;
      if (state === 'clear') { for (const s of stars) { s.y += s.z * 1.6; if (s.y > H) s.y = 0; } }
      if (pressReq && stateT > 45) { state = 'title'; }
      bombReq = false;
    }
    pressReq = false;
    if (state !== 'play') bombReq = false;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
