<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ネコ大戦争</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#8fd3ff;box-shadow:0 0 30px #000;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
'use strict';
// ====== 基本設定 ======
const W = 960, H = 540, GY = 400, WORLD = 1700, UI_Y = 432;
const cv = document.getElementById('game');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';

// ====== 音 ======
let AC = null, muted = false;
function beep(f, d, type = 'square', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfx = {
  spawn: () => beep(520, .08, 'square', .04, 300),
  hit: () => beep(160, .07, 'sawtooth', .04, -80),
  die: () => beep(300, .25, 'triangle', .05, -220),
  cannon: () => { beep(90, .6, 'sawtooth', .09, 500); beep(220, .5, 'square', .05, -100); },
  coin: () => beep(880, .06, 'square', .03),
  up: () => { beep(600, .1, 'square', .05); setTimeout(() => beep(900, .15, 'square', .05), 90); },
  no: () => beep(120, .12, 'square', .04),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .25, 'square', .05), i * 140)),
  lose: () => [400, 340, 280, 200].forEach((f, i) => setTimeout(() => beep(f, .3, 'triangle', .06), i * 180)),
};

// ====== ユニット定義 ======
// hp, atk, spd(px/s), range(px), cd(攻撃間隔s), wind(攻撃の溜め), kb(ノックバック回数), w(幅), cost, rc(再使用s)
const CATS = [
  { id: 'neko',  name: 'ネコ',       hp: 100,  atk: 8,   spd: 55, range: 10,  cd: 1.0, wind: .25, kb: 3, w: 34, cost: 50,  rc: 2 },
  { id: 'tank',  name: 'かべネコ',   hp: 450,  atk: 4,   spd: 40, range: 8,   cd: 1.3, wind: .3,  kb: 5, w: 40, cost: 100, rc: 4 },
  { id: 'axe',   name: 'アックス',   hp: 160,  atk: 42,  spd: 62, range: 12,  cd: 1.3, wind: .4,  kb: 3, w: 40, cost: 200, rc: 6 },
  { id: 'kick',  name: 'キック',     hp: 130,  atk: 26,  spd: 60, range: 115, cd: 1.7, wind: .4,  kb: 2, w: 40, cost: 300, rc: 8 },
  { id: 'giant', name: 'ネコ巨人',   hp: 1300, atk: 110, spd: 30, range: 34,  cd: 2.3, wind: .6,  kb: 3, w: 76, cost: 800, rc: 25, area: true },
];
const ENEMIES = {
  dog:   { name: 'ワンコ',   hp: 120,  atk: 8,  spd: 42,  range: 10, cd: 1.2, wind: .3,  kb: 3, w: 34, reward: 30 },
  snake: { name: 'ヘビ',     hp: 60,   atk: 6,  spd: 95,  range: 10, cd: 1.0, wind: .25, kb: 2, w: 40, reward: 20 },
  pig:   { name: 'ブタ',     hp: 550,  atk: 20, spd: 32,  range: 10, cd: 1.5, wind: .35, kb: 4, w: 46, reward: 100 },
  gori:  { name: 'ゴリラ',   hp: 1600, atk: 65, spd: 26,  range: 30, cd: 2.0, wind: .5,  kb: 3, w: 70, reward: 300, area: true },
  bear:  { name: 'クマ大王', hp: 4200, atk: 90, spd: 22,  range: 34, cd: 2.2, wind: .6,  kb: 3, w: 96, reward: 800, area: true, boss: true },
};

// ====== ステージ定義 ======
const STAGES = [
  { name: '1. はじまりの草原', base: 2500, mag: 1.0, sky: ['#8fd3ff', '#dff5ff'], ground: '#6fbf4a', hill: '#8ad05f',
    spawns: [{ u: 'dog', first: 3, every: 7, max: 30 }, { u: 'snake', first: 14, every: 12, max: 20 }],
    trig: [{ hp: .5, u: 'pig', n: 1 }, { hp: .2, u: 'dog', n: 4 }] },
  { name: '2. ヘビの砂漠', base: 5000, mag: 1.3, sky: ['#ffd98f', '#fff2cc'], ground: '#d8b56a', hill: '#e6c98a',
    spawns: [{ u: 'dog', first: 2, every: 5, max: 40 }, { u: 'snake', first: 6, every: 6, max: 40 }, { u: 'pig', first: 35, every: 22, max: 10 }],
    trig: [{ hp: .6, u: 'gori', n: 1 }, { hp: .25, u: 'pig', n: 2 }] },
  { name: '3. 大王の城', base: 9000, mag: 1.7, sky: ['#7a6aa8', '#c8b6e6'], ground: '#5a4a6a', hill: '#6d5b86',
    spawns: [{ u: 'dog', first: 2, every: 4, max: 60 }, { u: 'snake', first: 4, every: 5, max: 60 }, { u: 'pig', first: 20, every: 14, max: 20 }],
    trig: [{ hp: .75, u: 'gori', n: 1 }, { hp: .45, u: 'gori', n: 2 }, { hp: .3, u: 'bear', n: 1 }] },
];

// ====== ゲーム状態 ======
let scene = 'title';       // title | battle | result
let stageIdx = 0, cleared = 0;
try { cleared = +(localStorage.getItem('nyanko_cleared') || 0); } catch (e) {}
let G = null;              // 戦闘状態
let cam = 0, paused = false, speed = 1, tsec = 0;
let hover = null;

function walletMax(l) { return 400 * l; }
function walletRate(l) { return 8 * (l + 1); }
function walletCost(l) { return 100 * l; }
const MAXLV = 8;

function startBattle(i) {
  const st = STAGES[i];
  stageIdx = i; scene = 'battle'; paused = false;
  G = {
    st, t: 0, money: 0, lv: 1, cannon: 0, cannonMax: 30,
    catBase: { x: 90, w: 110, hp: 1500, max: 1500, side: 'cat', base: true },
    eneBase: { x: WORLD - 90, w: 110, hp: st.base, max: st.base, side: 'ene', base: true },
    cats: [], enes: [], dying: [], fx: [], pops: [],
    cd: CATS.map(() => 0), sp: st.spawns.map(s => ({ ...s, next: s.first, n: 0 })),
    trig: st.trig.map(t => ({ ...t, done: false })), queue: [], qt: 0,
    beam: 0, shake: 0, over: null, overT: 0,
  };
  cam = 0;
}

function mk(side, def, mag) {
  const dir = side === 'cat' ? 1 : -1;
  const hp = Math.round(def.hp * mag);
  return { side, def, dir, x: side === 'cat' ? G.catBase.x + 50 : G.eneBase.x - 50, y: 0, hp, max: hp, atk: Math.round(def.atk * mag),
    w: def.w, phase: 'walk', timer: 0, kbStep: def.kb - 1, kbT: 0, kbv: 0, anim: Math.random() * 6, flash: 0, alpha: 1, seed: Math.random() * 10 };
}
function spawnCat(i) {
  const d = CATS[i];
  if (G.over || G.cd[i] > 0) return;
  if (G.money < d.cost) { sfx.no(); return; }
  G.money -= d.cost; G.cd[i] = d.rc;
  G.cats.push(mk('cat', d, 1)); sfx.spawn();
}
function spawnEne(id) {
  const d = ENEMIES[id];
  const u = mk('ene', d, G.st.mag);
  u.x += (Math.random() * 20 - 10);
  G.enes.push(u);
}
function upgradeWallet() {
  const c = walletCost(G.lv);
  if (G.over) return;
  if (G.lv >= MAXLV || G.money < c) { sfx.no(); return; }
  G.money -= c; G.lv++; sfx.up();
}
function fireCannon() {
  if (G.over || G.cannon < G.cannonMax) { if (!G.over) sfx.no(); return; }
  G.cannon = 0; G.beam = 1; G.shake = .5; sfx.cannon();
  for (const e of G.enes) {
    if (e.x < G.catBase.x + 900) { hurt(e, 500 * 1, true); }
  }
}

// ====== 戦闘ロジック ======
function gap(a, b) { return Math.abs(a.x - b.x) - (a.w + b.w) / 2; }

function findTarget(u) {
  const foes = u.side === 'cat' ? G.enes : G.cats;
  const base = u.side === 'cat' ? G.eneBase : G.catBase;
  let best = null, bg = 1e9;
  for (const o of foes) {
    if (o.hp <= 0 || o.kbT > 0 && false) continue;
    if ((o.x - u.x) * u.dir < -20) continue;
    const g = gap(u, o);
    if (g < bg) { bg = g; best = o; }
  }
  const bgap = gap(u, base);
  if (best && bg <= u.def.range) return best;
  if (bgap <= u.def.range) return base;
  return null;
}

function hurt(t, dmg, forceKb) {
  if (t.base) {
    t.hp = Math.max(0, t.hp - dmg);
    G.pops.push({ x: t.x + (Math.random() * 30 - 15), y: GY - 130, txt: dmg, life: .7, c: '#fff' });
    return;
  }
  if (t.hp <= 0) return;
  t.hp -= dmg; t.flash = .12;
  G.pops.push({ x: t.x, y: GY - 60 - t.w * .3, txt: Math.round(dmg), life: .6, c: t.side === 'cat' ? '#ff8080' : '#fff' });
  if (t.hp <= 0) { kill(t); return; }
  let kb = forceKb;
  while (t.kbStep > 0 && t.hp <= t.max * t.kbStep / t.def.kb) { t.kbStep--; kb = true; }
  if (kb) { t.phase = 'kb'; t.kbT = .5; t.timer = 0; }
  sfx.hit();
}
function kill(t) {
  t.hp = 0; t.dead = true; t.deadT = .45;
  (t.side === 'cat' ? G.cats : G.enes).splice((t.side === 'cat' ? G.cats : G.enes).indexOf(t), 1);
  G.dying.push(t);
  if (t.side === 'ene') { G.money = Math.min(walletMax(G.lv), G.money + Math.round(t.def.reward)); }
  for (let i = 0; i < 8; i++) G.fx.push({ x: t.x, y: GY - 20, vx: (Math.random() - .5) * 220, vy: -Math.random() * 200, life: .5, c: t.side === 'cat' ? '#fff' : '#ffd166' });
  sfx.die();
}

function doHit(u) {
  const foes = u.side === 'cat' ? G.enes : G.cats;
  const base = u.side === 'cat' ? G.eneBase : G.catBase;
  const d = u.def;
  if (d.area) {
    let any = false;
    for (const o of foes.slice()) {
      if ((o.x - u.x) * u.dir < -20) continue;
      if (gap(u, o) <= d.range) { hurt(o, u.atk); any = true; }
    }
    if (gap(u, base) <= d.range) { hurt(base, u.atk); any = true; }
    if (any) { G.shake = Math.max(G.shake, .18); for (let i = 0; i < 6; i++) G.fx.push({ x: u.x + u.dir * (u.w / 2 + 20), y: GY - 6, vx: (Math.random() - .3) * 160 * u.dir, vy: -Math.random() * 160, life: .4, c: '#f4e9c8' }); }
    return;
  }
  const t = findTarget(u);
  if (t) {
    hurt(t, u.atk);
    G.fx.push({ x: t.x - u.dir * (t.w / 2), y: GY - 30, vx: 0, vy: -30, life: .25, c: '#fff', star: true });
  }
}

function updUnit(u, dt) {
  u.anim += dt; if (u.flash > 0) u.flash -= dt;
  const d = u.def;
  if (u.phase === 'kb') {
    u.kbT -= dt;
    const k = Math.max(0, u.kbT) / .5;
    u.x -= u.dir * 230 * k * dt;
    u.y = -Math.sin((1 - k) * Math.PI) * 32;
    const baseHome = u.side === 'cat' ? G.catBase.x + 20 : G.eneBase.x - 20;
    if (u.side === 'cat') u.x = Math.max(u.x, baseHome); else u.x = Math.min(u.x, baseHome);
    if (u.kbT <= 0) { u.y = 0; u.phase = 'walk'; }
    return;
  }
  if (u.phase === 'walk') {
    if (findTarget(u)) { u.phase = 'wind'; u.timer = d.wind; }
    else u.x += u.dir * d.spd * dt;
  } else if (u.phase === 'wind') {
    u.timer -= dt;
    if (u.timer <= 0) { doHit(u); u.phase = 'cool'; u.timer = Math.max(.1, d.cd - d.wind); }
  } else if (u.phase === 'cool') {
    u.timer -= dt;
    if (u.timer <= 0) u.phase = 'walk';
  }
}

function update(dt) {
  if (scene !== 'battle' || paused) return;
  const g = G;
  g.t += dt;
  if (g.over) {
    g.overT += dt;
    for (const f of g.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; f.life -= dt; }
    g.fx = g.fx.filter(f => f.life > 0);
    for (const t of g.dying) t.deadT -= dt;
    g.dying = g.dying.filter(t => t.deadT > 0);
    return;
  }
  // お金・大砲・クールダウン
  g.money = Math.min(walletMax(g.lv), g.money + walletRate(g.lv) * dt);
  g.cannon = Math.min(g.cannonMax, g.cannon + dt);
  for (let i = 0; i < g.cd.length; i++) if (g.cd[i] > 0) g.cd[i] -= dt;
  if (g.beam > 0) g.beam -= dt * 1.6;
  if (g.shake > 0) g.shake -= dt;

  // 敵のスポーン
  for (const s of g.sp) {
    if (g.t >= s.next && s.n < s.max) {
      spawnEne(s.u); s.n++; s.next = g.t + s.every * (0.85 + Math.random() * .3);
    }
  }
  const frac = g.eneBase.hp / g.eneBase.max;
  for (const t of g.trig) {
    if (!t.done && frac <= t.hp) { t.done = true; for (let i = 0; i < t.n; i++) g.queue.push(t.u); }
  }
  g.qt -= dt;
  if (g.queue.length && g.qt <= 0) { spawnEne(g.queue.shift()); g.qt = 1.2; }

  for (const u of g.cats.slice()) updUnit(u, dt);
  for (const u of g.enes.slice()) updUnit(u, dt);
  // ぶつかり防止（味方どうしの重なり軽減）
  for (const list of [g.cats, g.enes]) {
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const a = list[i], b = list[j];
      if (a.phase !== 'walk' || b.phase !== 'walk') continue;
      const dx = a.x - b.x, mn = Math.min(a.w, b.w) * .4;
      if (Math.abs(dx) < mn) { const p = (mn - Math.abs(dx)) * .04 * (dx >= 0 ? 1 : -1); a.x += p; b.x -= p; }
    }
  }
  for (const t of g.dying) t.deadT -= dt;
  g.dying = g.dying.filter(t => t.deadT > 0);
  for (const f of g.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; f.life -= dt; }
  g.fx = g.fx.filter(f => f.life > 0);
  for (const p of g.pops) { p.y -= 30 * dt; p.life -= dt; }
  g.pops = g.pops.filter(p => p.life > 0);

  // 勝敗
  if (g.eneBase.hp <= 0) {
    g.over = 'win'; g.overT = 0; sfx.win();
    for (const e of g.enes.slice()) { e.reward = 0; kill(e); }
    if (stageIdx + 1 > cleared) { cleared = stageIdx + 1; try { localStorage.setItem('nyanko_cleared', cleared); } catch (e) {} }
  } else if (g.catBase.hp <= 0) {
    g.over = 'lose'; g.overT = 0; sfx.lose();
  }
}

// ====== 描画ヘルパー ======
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function outline(fill) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke(); }
function text(s, x, y, size, color = '#fff', align = 'left', stroke = '#222') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size / 5; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function eyes(y, dx = 6, r = 2.4) {
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-dx + 3, y, r, 0, 7); ctx.arc(dx + 3, y, r, 0, 7); ctx.fill();
}

// キャラ描画（原点=足元中央。ネコは右向き、敵は反転して描画）
function drawCatBody(id, u, t, atk) {
  const walk = u.phase === 'walk' ? Math.sin(t * 9) : 0;
  const lean = atk * 6;
  ctx.save(); ctx.translate(lean, -Math.abs(walk) * 3);
  if (id === 'tank') {
    ctx.beginPath(); rr(-18, -68, 36, 60, 8); outline('#fff');
    ctx.beginPath(); ctx.moveTo(-18, -68); ctx.lineTo(-14, -80); ctx.lineTo(-6, -68); ctx.moveTo(18, -68); ctx.lineTo(14, -80); ctx.lineTo(6, -68);
    ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke();
    eyes(-46, 7, 3); ctx.beginPath(); ctx.arc(3, -34, 5, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = '#ddd'; ctx.fillRect(-12, -8, 8, 6 + walk * 2); ctx.fillRect(4, -8, 8, 6 - walk * 2);
  } else if (id === 'giant') {
    ctx.scale(2.1, 2.1);
    ctx.beginPath(); rr(-16, -34, 32, 26, 10); outline('#fff');
    ctx.beginPath(); ctx.moveTo(-15, -30); ctx.lineTo(-13, -42); ctx.lineTo(-4, -34); ctx.moveTo(15, -30); ctx.lineTo(13, -42); ctx.lineTo(4, -34); ctx.stroke();
    ctx.fillStyle = '#e33'; ctx.fillRect(-16, -30, 32, 4);
    eyes(-22, 6, 2.4); ctx.beginPath(); ctx.arc(3, -14, 4, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(-10, -9, 6, 8 + walk * 2); ctx.fillRect(4, -9, 6, 8 - walk * 2); ctx.strokeRect(-10, -9, 6, 8); ctx.strokeRect(4, -9, 6, 8);
    if (atk > 0) { ctx.beginPath(); ctx.arc(22, -20, 8, 0, 7); outline('#fff'); }
  } else {
    // ネコ / アックス / キック 共通
    const tall = id === 'kick' ? 12 : 0;
    ctx.beginPath(); rr(-15, -30 - tall, 30, 24, 9); outline('#fff');
    ctx.beginPath(); ctx.moveTo(-14, -28 - tall); ctx.lineTo(-12, -40 - tall); ctx.lineTo(-4, -31 - tall); ctx.moveTo(14, -28 - tall); ctx.lineTo(12, -40 - tall); ctx.lineTo(4, -31 - tall);
    ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke();
    eyes(-20 - tall, 6, 2.4); ctx.beginPath(); ctx.arc(3, -13 - tall, 3.5, 0, Math.PI); ctx.stroke();
    if (id === 'kick') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); rr(-10, -8 - tall + 2, 7, 22 + tall - 2 + walk * 2, 3); outline('#fff');
      ctx.save(); ctx.translate(3, -6); ctx.rotate(atk > 0 ? -atk * 1.2 : -walk * .3);
      ctx.beginPath(); rr(0, 0, 8 + (atk > 0 ? 34 : 0), 7, 3); outline('#fff'); ctx.restore();
    } else {
      ctx.fillStyle = '#fff'; ctx.fillRect(-10, -8, 6, 8 + walk * 2); ctx.fillRect(4, -8, 6, 8 - walk * 2);
      ctx.lineWidth = 2; ctx.strokeRect(-10, -8, 6, 8); ctx.strokeRect(4, -8, 6, 8);
    }
    if (id === 'axe') {
      ctx.save(); ctx.translate(14, -18); ctx.rotate(atk > 0 ? atk * 2.4 - .8 : -1.0 + walk * .1);
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-2, -30, 4, 34);
      ctx.beginPath(); ctx.moveTo(2, -30); ctx.lineTo(18, -34); ctx.lineTo(18, -14); ctx.lineTo(2, -18); ctx.closePath(); outline('#c7ccd4');
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawEneBody(id, u, t, atk) {
  const walk = u.phase === 'walk' ? Math.sin(t * 9 + u.seed) : 0;
  ctx.save(); ctx.translate(atk * 6, -Math.abs(walk) * 3);
  if (id === 'dog') {
    ctx.beginPath(); ctx.ellipse(0, -18, 20, 15, 0, 0, 7); outline('#c98b4e');
    ctx.beginPath(); ctx.ellipse(-14, -22, 7, 5, 0, 0, 7); outline('#e8c9a0');
    ctx.beginPath(); ctx.ellipse(6, -34, 5, 9, -.3, 0, 7); outline('#8a5a2b');
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-19, -25, 2.5, 0, 7); ctx.arc(-5, -24, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#c98b4e'; ctx.fillRect(-12, -6, 6, 6 + walk * 2); ctx.fillRect(6, -6, 6, 6 - walk * 2);
    ctx.lineWidth = 2; ctx.strokeRect(-12, -6, 6, 6); ctx.strokeRect(6, -6, 6, 6);
  } else if (id === 'snake') {
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) { const x = 20 - i * 4.6, y = -8 + Math.sin(i * .9 + t * 6) * 4; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.lineWidth = 12; ctx.strokeStyle = '#222'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = '#5ec04a'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-24, -12, 9, 7, 0, 0, 7); outline('#5ec04a');
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-26, -14, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-33, -11); ctx.lineTo(-40, -11); ctx.stroke();
  } else if (id === 'pig') {
    ctx.beginPath(); ctx.ellipse(0, -24, 26, 20, 0, 0, 7); outline('#ff9db8');
    ctx.beginPath(); ctx.ellipse(-24, -22, 7, 9, 0, 0, 7); outline('#ff7fa4');
    ctx.beginPath(); ctx.moveTo(-8, -40); ctx.lineTo(-2, -50); ctx.lineTo(4, -40); ctx.closePath(); outline('#ff9db8');
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-12, -30, 2.6, 0, 7); ctx.arc(-26, -22, 1.4, 0, 7); ctx.arc(-22, -22, 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff9db8'; ctx.fillRect(-14, -6, 8, 6 + walk * 2); ctx.fillRect(8, -6, 8, 6 - walk * 2);
    ctx.lineWidth = 2; ctx.strokeRect(-14, -6, 8, 6); ctx.strokeRect(8, -6, 8, 6);
  } else { // gori / bear
    const bear = id === 'bear', s = bear ? 1.5 : 1;
    ctx.scale(s, s);
    const c1 = bear ? '#7a4a2a' : '#4a4550', c2 = bear ? '#d9b48a' : '#8a8494';
    ctx.beginPath(); ctx.ellipse(0, -30, 26, 26, 0, 0, 7); outline(c1);
    ctx.beginPath(); ctx.ellipse(-4, -26, 15, 17, 0, 0, 7); outline(c2);
    ctx.beginPath(); ctx.arc(-6, -58, 15, 0, 7); outline(c1);
    if (bear) { ctx.beginPath(); ctx.arc(-18, -70, 6, 0, 7); ctx.arc(6, -70, 6, 0, 7); outline(c1); }
    ctx.beginPath(); ctx.ellipse(-8, -54, 9, 7, 0, 0, 7); outline(c2);
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-13, -62, 2.6, 0, 7); ctx.arc(-3, -62, 2.6, 0, 7); ctx.fill();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-15, -66); ctx.lineTo(-10, -64); ctx.moveTo(1, -64); ctx.lineTo(6, -66); ctx.stroke();
    ctx.save(); ctx.translate(-14, -40); ctx.rotate(atk > 0 ? -atk * 1.6 + 1 : .3 + walk * .2);
    ctx.beginPath(); rr(-6, 0, 12, 30, 6); outline(c1); ctx.restore();
    ctx.fillStyle = c1; ctx.fillRect(-16, -8, 12, 8 + walk * 2); ctx.fillRect(4, -8, 12, 8 - walk * 2);
    ctx.lineWidth = 2; ctx.strokeRect(-16, -8, 12, 8); ctx.strokeRect(4, -8, 12, 8);
  }
  ctx.restore();
}

function drawUnit(u) {
  const atk = u.phase === 'wind' ? 1 - u.timer / u.def.wind : 0;
  ctx.save();
  ctx.translate(u.x - cam, GY + u.y);
  if (u.dead) ctx.globalAlpha = Math.max(0, u.deadT / .45);
  if (u.flash > 0) ctx.translate((Math.random() - .5) * 4, 0);
  // 影
  if (!u.dead) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, -u.y + 2, u.w * .5, 5, 0, 0, 7); ctx.fill(); }
  if (u.dead) ctx.translate(0, (1 - u.deadT / .45) * -30);
  ctx.scale(u.dir, 1);
  if (u.side === 'cat') drawCatBody(u.def.id, u, u.anim, atk); else drawEneBody(u.def.id || ENEMY_ID.get(u.def), u, u.anim, atk);
  ctx.restore();
  // HPバー
  if (!u.dead && u.hp < u.max) {
    const bw = Math.max(30, u.w), bx = u.x - cam - bw / 2, by = GY - (u.def.boss ? 150 : u.w > 60 ? 120 : 62) - 6;
    ctx.fillStyle = '#222'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = u.side === 'cat' ? '#4ad0ff' : '#ff5b5b'; ctx.fillRect(bx, by, bw * u.hp / u.max, 4);
  }
}
const ENEMY_ID = new Map(Object.entries(ENEMIES).map(([k, v]) => [v, k]));

function drawBase(b, isCat) {
  const x = b.x - cam;
  ctx.save(); ctx.translate(x, GY);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 2, 70, 8, 0, 0, 7); ctx.fill();
  if (isCat) {
    ctx.beginPath(); rr(-46, -110, 92, 110, 6); outline('#c9975a');
    ctx.strokeStyle = '#8a6032'; ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-46, -i * 22); ctx.lineTo(46, -i * 22); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-46, -110); ctx.lineTo(-38, -140); ctx.lineTo(-14, -110); ctx.moveTo(46, -110); ctx.lineTo(38, -140); ctx.lineTo(14, -110);
    ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-16, -75, 9, 0, 7); ctx.arc(16, -75, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-16, -75, 4, 0, 7); ctx.arc(16, -75, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -52, 8, 0, Math.PI); ctx.lineWidth = 3; ctx.stroke();
    // 大砲
    ctx.save(); ctx.translate(44, -50); ctx.rotate(-.3);
    ctx.beginPath(); rr(0, -9, 44, 18, 4); outline('#666'); ctx.restore();
  } else {
    ctx.beginPath(); rr(-44, -170, 88, 170, 4); outline('#4a3a5a');
    ctx.beginPath(); ctx.moveTo(-54, -170); ctx.lineTo(0, -215); ctx.lineTo(54, -170); ctx.closePath(); outline('#7a2a3a');
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); rr(-12, -120, 24, 40, 10); ctx.fill();
    ctx.fillStyle = '#ff5b5b'; ctx.beginPath(); ctx.arc(-18, -145, 6, 0, 7); ctx.arc(18, -145, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -215); ctx.lineTo(0, -240); ctx.stroke();
    ctx.fillStyle = '#e33'; ctx.beginPath(); ctx.moveTo(0, -240); ctx.lineTo(28, -232); ctx.lineTo(0, -224); ctx.fill();
  }
  ctx.restore();
  // HPバー
  const bw = 100, by = GY - (isCat ? 158 : 258);
  ctx.fillStyle = '#222'; ctx.fillRect(x - bw / 2 - 2, by - 2, bw + 4, 12);
  ctx.fillStyle = isCat ? '#4ad0ff' : '#ff5b5b'; ctx.fillRect(x - bw / 2, by, bw * b.hp / b.max, 8);
  text(Math.ceil(b.hp) + '/' + b.max, x, by - 12, 13);
}

function drawBackground() {
  const st = STAGES[stageIdx];
  const gr = ctx.createLinearGradient(0, 0, 0, GY);
  gr.addColorStop(0, st.sky[0]); gr.addColorStop(1, st.sky[1]);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, GY);
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 330 - cam * .2 + tsec * 6) % (W + 300) + W + 300) % (W + 300) - 150, cy = 60 + (i % 3) * 45;
    ctx.beginPath(); ctx.ellipse(cx, cy, 50, 16, 0, 0, 7); ctx.ellipse(cx + 30, cy - 8, 32, 14, 0, 0, 7); ctx.fill();
  }
  // 丘
  ctx.fillStyle = st.hill;
  for (let i = -1; i < 8; i++) {
    const hx = i * 260 - (cam * .4) % 260;
    ctx.beginPath(); ctx.ellipse(hx + 130, GY, 170, 90 + (i & 1) * 30, 0, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = st.ground; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, GY, W, 6);
  ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 2;
  for (let i = -1; i < 24; i++) { const x = i * 80 - cam % 80; ctx.beginPath(); ctx.moveTo(x, GY + 8); ctx.lineTo(x - 30, H); ctx.stroke(); }
}

function drawUI() {
  const g = G;
  // 上部HUD
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, 44);
  text('¥ ' + Math.floor(g.money) + ' / ' + walletMax(g.lv), 16, 22, 24, '#ffe14a');
  text(STAGES[stageIdx].name, W / 2, 22, 18, '#fff', 'center');
  text(speed === 2 ? '▶▶ x2' : '▶ x1', W - 130, 22, 18, '#fff', 'right');
  text(paused ? '▶ 再開' : 'Ⅱ 停止', W - 16, 22, 18, '#fff', 'right');
  // ミニマップ
  const mx = 300, mw = 360, my = 46;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(mx, my, mw, 8);
  for (const u of g.cats) { ctx.fillStyle = '#4ad0ff'; ctx.fillRect(mx + u.x / WORLD * mw - 1, my, 3, 8); }
  for (const u of g.enes) { ctx.fillStyle = '#ff5b5b'; ctx.fillRect(mx + u.x / WORLD * mw - 1, my, 3, 8); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(mx + cam / WORLD * mw, my - 1, W / WORLD * mw, 10);

  // 下部パネル
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(0, UI_Y, W, H - UI_Y);
  ctx.fillStyle = '#444b5c'; ctx.fillRect(0, UI_Y, W, 4);
  for (let i = 0; i < CATS.length; i++) {
    const b = btnRect(i), d = CATS[i], ready = g.cd[i] <= 0, afford = g.money >= d.cost;
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.beginPath(); rr(0, 0, b.w, b.h, 10); ctx.fillStyle = ready && afford ? '#f6f0d8' : '#8a8f9c'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
    // アイコン
    ctx.save(); ctx.beginPath(); rr(4, 4, b.w - 8, b.h - 30, 6); ctx.clip();
    ctx.translate(b.w / 2, b.h - 30); ctx.scale(d.id === 'giant' ? .38 : d.id === 'tank' ? .8 : .95, d.id === 'giant' ? .38 : d.id === 'tank' ? .8 : .95);
    drawCatBody(d.id, { phase: 'idle' }, 0, 0); ctx.restore();
    text('¥' + d.cost, b.w / 2, b.h - 13, 17, afford ? '#ffe14a' : '#ffb0b0');
    if (!ready) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(4, b.h - 30 - (b.h - 34) * (g.cd[i] / d.rc), b.w - 8, (b.h - 34) * (g.cd[i] / d.rc)); }
    text(i + 1, 12, 14, 13, '#fff');
    ctx.restore();
  }
  // 財布UP
  const u = upRect(), full = g.lv >= MAXLV, can = !full && g.money >= walletCost(g.lv);
  ctx.beginPath(); rr(u.x, u.y, u.w, u.h, 10); ctx.fillStyle = can ? '#ffd166' : '#8a8f9c'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
  text('お財布 Lv' + g.lv, u.x + u.w / 2, u.y + 24, 18, '#222', 'center', null);
  text(full ? 'MAX' : '強化 ¥' + walletCost(g.lv), u.x + u.w / 2, u.y + 52, 17, can ? '#7a3d00' : '#222', 'center', null);
  text('[Q]', u.x + u.w / 2, u.y + 74, 12, '#333', 'center', null);
  // 大砲
  const c = cannonRect(), rdy = g.cannon >= g.cannonMax;
  ctx.beginPath(); rr(c.x, c.y, c.w, c.h, 10); ctx.fillStyle = rdy ? (Math.floor(tsec * 4) % 2 ? '#ff7a59' : '#ff4d2e') : '#8a8f9c'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
  text('ネコキャノン', c.x + c.w / 2, c.y + 24, 17, rdy ? '#fff' : '#222', 'center', rdy ? '#222' : null);
  ctx.fillStyle = '#222'; ctx.fillRect(c.x + 12, c.y + 44, c.w - 24, 14);
  ctx.fillStyle = rdy ? '#ffe14a' : '#4ad0ff'; ctx.fillRect(c.x + 14, c.y + 46, (c.w - 28) * g.cannon / g.cannonMax, 10);
  text(rdy ? 'OK!  [Space]' : Math.ceil(g.cannonMax - g.cannon) + '秒', c.x + c.w / 2, c.y + 74, 13, rdy ? '#fff' : '#222', 'center', null);
}
function btnRect(i) { return { x: 12 + i * 118, y: UI_Y + 10, w: 110, h: 90 }; }
function upRect() { return { x: 612, y: UI_Y + 10, w: 160, h: 90 }; }
function cannonRect() { return { x: 786, y: UI_Y + 10, w: 162, h: 90 }; }
const inR = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function drawBattle() {
  const g = G;
  ctx.save();
  if (g.shake > 0) ctx.translate((Math.random() - .5) * 8 * g.shake * 2, (Math.random() - .5) * 8 * g.shake * 2);
  drawBackground();
  drawBase(g.catBase, true); drawBase(g.eneBase, false);
  const all = g.cats.concat(g.enes, g.dying).sort((a, b) => (a.w > 60) - (b.w > 60));
  for (const u of all) drawUnit(u);
  // ビーム
  if (g.beam > 0) {
    const bx = g.catBase.x + 88 - cam, by = GY - 66;
    ctx.save(); ctx.globalAlpha = Math.min(1, g.beam);
    const w = 900 * (1 - g.beam) * 0 + 900;
    const gr = ctx.createLinearGradient(bx, 0, bx + w, 0);
    gr.addColorStop(0, '#fff'); gr.addColorStop(.7, '#ffe14a'); gr.addColorStop(1, 'rgba(255,225,74,0)');
    ctx.fillStyle = gr; ctx.fillRect(bx, by - 26 * g.beam - 6, w, 52 * g.beam + 12);
    ctx.restore();
  }
  for (const f of g.fx) {
    ctx.globalAlpha = Math.max(0, f.life * 2);
    if (f.star) { ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 3; ctx.beginPath(); for (let a = 0; a < 6; a++) { ctx.moveTo(f.x - cam, f.y); ctx.lineTo(f.x - cam + Math.cos(a) * 12, f.y + Math.sin(a) * 12); } ctx.stroke(); }
    else { ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x - cam, f.y, 4, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  for (const p of g.pops) { ctx.globalAlpha = Math.min(1, p.life * 3); text(p.txt, p.x - cam, p.y, 16, p.c, 'center'); ctx.globalAlpha = 1; }
  ctx.restore();
  drawUI();
  if (paused && !g.over) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 44, W, UI_Y - 44); text('ポーズ中', W / 2, 220, 48, '#fff', 'center'); text('P か 右上をタップで再開', W / 2, 280, 20, '#fff', 'center'); }
  if (g.over) {
    const a = Math.min(1, g.overT * 1.5);
    ctx.fillStyle = `rgba(0,0,0,${.55 * a})`; ctx.fillRect(0, 44, W, UI_Y - 44);
    ctx.globalAlpha = a;
    text(g.over === 'win' ? 'ステージクリア！' : 'ネコ基地が落ちた…', W / 2, 190, 52, g.over === 'win' ? '#ffe14a' : '#ff8080', 'center');
    if (g.overT > 1) {
      text(g.over === 'win' && stageIdx < STAGES.length - 1 ? 'タップで次のステージへ' : 'タップでタイトルへ', W / 2, 270, 24, '#fff', 'center');
      if (g.over === 'lose') text('R キーでリトライ', W / 2, 310, 20, '#fff', 'center');
    }
    ctx.globalAlpha = 1;
  }
}

// ====== タイトル ======
function stageRect(i) { return { x: W / 2 - 230, y: 250 + i * 76, w: 460, h: 62 }; }
function drawTitle() {
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#8fd3ff'); gr.addColorStop(.7, '#dff5ff'); gr.addColorStop(.7, '#6fbf4a'); gr.addColorStop(1, '#4e9a34');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // 歩くネコ
  for (let i = 0; i < 4; i++) {
    const x = ((tsec * 60 + i * 260) % (W + 200)) - 100;
    ctx.save(); ctx.translate(x, 500); ctx.scale(1.2, 1.2); drawCatBody(i % 2 ? 'axe' : 'neko', { phase: 'walk' }, tsec + i, 0); ctx.restore();
  }
  ctx.save(); ctx.translate(W / 2, 120); ctx.rotate(-.03);
  text('ネコ大戦争', 0, 0, 84, '#fff', 'center', '#e07a1a');
  ctx.restore();
  text('ネコを出して、ワンコ基地を倒そう！', W / 2, 190, 22, '#fff', 'center');
  for (let i = 0; i < STAGES.length; i++) {
    const r = stageRect(i), open = i <= cleared;
    ctx.beginPath(); rr(r.x, r.y, r.w, r.h, 14); ctx.fillStyle = open ? (hover === i ? '#ffe98a' : '#ffd166') : '#8a8f9c'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#222'; ctx.stroke();
    text(open ? STAGES[i].name : '🔒 ' + STAGES[i].name.replace(/^\d+\./, '?.'), r.x + 24, r.y + r.h / 2, 24, '#3a2200', 'left', null);
    if (i < cleared) text('★CLEAR', r.x + r.w - 20, r.y + r.h / 2, 18, '#d33', 'right', null);
  }
  text('1〜5: ネコ出撃 / Q: お財布強化 / Space: 大砲 / ←→: 画面移動 / P: ポーズ / M: 音', W / 2, 512, 14, '#fff', 'center');
}

// ====== 入力 ======
const keys = {};
addEventListener('keydown', e => {
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if (scene === 'battle') {
    if (e.code >= 'Digit1' && e.code <= 'Digit5') spawnCat(+e.code.slice(5) - 1);
    else if (e.code === 'KeyQ') upgradeWallet();
    else if (e.code === 'Space' || e.code === 'KeyF') { fireCannon(); e.preventDefault(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused;
    else if (e.code === 'KeyR' && G.over === 'lose') startBattle(stageIdx);
    else if (e.code === 'KeyS') speed = speed === 1 ? 2 : 1;
  }
  if (e.code === 'KeyM') muted = !muted;
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let drag = null;
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  beep(1, .01, 'square', 0.0001); // AudioContext を有効化
  if (scene === 'title') {
    for (let i = 0; i < STAGES.length; i++) if (i <= cleared && inR(stageRect(i), p.x, p.y)) { startBattle(i); return; }
    return;
  }
  if (scene !== 'battle') return;
  if (G.over) {
    if (G.overT > 1) {
      if (G.over === 'win' && stageIdx < STAGES.length - 1) startBattle(stageIdx + 1);
      else if (G.over === 'lose') scene = 'title';
      else scene = 'title';
    }
    return;
  }
  if (p.y < 44) {
    if (p.x > W - 100) paused = !paused; else if (p.x > W - 240 && p.x < W - 110) speed = speed === 1 ? 2 : 1;
    return;
  }
  if (p.y >= UI_Y) {
    for (let i = 0; i < CATS.length; i++) if (inR(btnRect(i), p.x, p.y)) { spawnCat(i); return; }
    if (inR(upRect(), p.x, p.y)) upgradeWallet();
    else if (inR(cannonRect(), p.x, p.y)) fireCannon();
    return;
  }
  drag = { x: p.x, cam };
});
cv.addEventListener('pointermove', e => {
  const p = pos(e);
  if (scene === 'title') { hover = null; for (let i = 0; i < STAGES.length; i++) if (i <= cleared && inR(stageRect(i), p.x, p.y)) hover = i; }
  if (drag) cam = Math.max(0, Math.min(WORLD - W, drag.cam - (p.x - drag.x)));
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

// ====== メインループ ======
let last = performance.now();
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  tsec += dt;
  if (scene === 'battle') {
    const sc = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    if (sc) cam = Math.max(0, Math.min(WORLD - W, cam + sc * 600 * dt));
    for (let i = 0; i < speed; i++) update(dt);
    drawBattle();
  } else drawTitle();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
