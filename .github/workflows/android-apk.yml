name: Android APK

on:
  push:
    paths:
      - 'english-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        # ubuntu-latest には Android SDK が入っている（ANDROID_HOME 設定済み）
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chugaku-eigo-apk
          path: english-app/android/app/build/outputs/apk/debug/app-debug.apk
