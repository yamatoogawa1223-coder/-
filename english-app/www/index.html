<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="description" content="中学1〜3年の英単語・文法・並べかえを練習できるアプリ">
<title>中学英語トレーニング</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --sub: #5b6477; --line: #dfe4ee;
    --primary: #2f6fed; --primary-ink: #ffffff; --primary-soft: #e6eeff;
    --ok: #1f9d55; --ok-soft: #e3f6ea; --ng: #d64545; --ng-soft: #fde8e8;
    --g1: #ff8a3d; --g2: #2fb67c; --g3: #8a5cf6;
    --shadow: 0 2px 10px rgba(20, 30, 60, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141b; --card: #1b202b; --text: #e8ecf4; --sub: #9aa3b5; --line: #2c3342;
      --primary: #5b8dff; --primary-ink: #0d1220; --primary-soft: #1f2a44;
      --ok: #3ccf7a; --ok-soft: #173325; --ng: #ff6b6b; --ng-soft: #3a1d1f;
      --shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141b; --card: #1b202b; --text: #e8ecf4; --sub: #9aa3b5; --line: #2c3342;
    --primary: #5b8dff; --primary-ink: #0d1220; --primary-soft: #1f2a44;
    --ok: #3ccf7a; --ok-soft: #173325; --ng: #ff6b6b; --ng-soft: #3a1d1f;
    --shadow: 0 2px 10px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    font-size: 16px; line-height: 1.5; min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .app { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header.top { display: flex; align-items: center; gap: 8px; min-height: 48px; margin-bottom: 8px; }
  header.top h1 { font-size: 20px; margin: 0; flex: 1; }
  .iconbtn { border: 0; background: var(--card); color: var(--text); width: 44px; height: 44px; border-radius: 12px; font-size: 20px; box-shadow: var(--shadow); cursor: pointer; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .muted { color: var(--sub); font-size: 14px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; }
  .seg button { border: 0; padding: 10px 0; border-radius: 9px; font-weight: 700; font-size: 15px; background: transparent; color: var(--sub); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode { border: 0; text-align: left; background: var(--card); color: var(--text); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); cursor: pointer; min-height: 112px; display: flex; flex-direction: column; gap: 4px; }
  .mode .ic { font-size: 28px; }
  .mode b { font-size: 16px; }
  .mode span { font-size: 13px; color: var(--sub); }
  .mode:active, .choice:active, .btn:active, .chip:active { transform: scale(.98); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 8px; }
  .stats b { display: block; font-size: 22px; }
  .stats span { font-size: 12px; color: var(--sub); }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 14px; }
  .progress i { display: block; height: 100%; background: var(--primary); width: 0; transition: width .3s; }
  .qhead { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--sub); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); }
  .question { font-size: 24px; font-weight: 700; text-align: center; margin: 18px 0 8px; word-break: break-word; }
  .question.en { font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; }
  .question.small { font-size: 20px; }
  .speak { display: block; margin: 0 auto 10px; border: 0; background: var(--primary-soft); color: var(--primary); border-radius: 99px; padding: 8px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .choices { display: grid; gap: 10px; margin-top: 12px; }
  .choice { border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 14px; padding: 14px 16px; font-size: 18px; text-align: left; cursor: pointer; min-height: 56px; }
  .choice.ok { border-color: var(--ok); background: var(--ok-soft); }
  .choice.ng { border-color: var(--ng); background: var(--ng-soft); }
  .choice:disabled { cursor: default; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 15px; display: none; }
  .feedback.ok { display: block; background: var(--ok-soft); }
  .feedback.ng { display: block; background: var(--ng-soft); }
  .feedback b { font-size: 17px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 700; background: var(--primary); color: var(--primary-ink); cursor: pointer; margin-top: 14px; }
  .btn.ghost { background: var(--card); color: var(--text); border: 2px solid var(--line); }
  .btn[hidden] { display: none; }
  .answer-box { min-height: 64px; border: 2px dashed var(--line); border-radius: 14px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; margin-top: 14px; }
  .answer-box.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
  .answer-box.ng { border-style: solid; border-color: var(--ng); background: var(--ng-soft); }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 48px; }
  .chip { border: 2px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 14px; font-size: 18px; cursor: pointer; }
  .chip.placed { background: var(--primary-soft); border-color: var(--primary); }
  .flash { perspective: 1000px; height: 240px; margin: 10px 0; cursor: pointer; }
  .flash-inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
  .flash.flipped .flash-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  .face.back { transform: rotateY(180deg); }
  .face .w { font-size: 34px; font-weight: 800; word-break: break-word; }
  .face .hint { position: absolute; bottom: 12px; font-size: 12px; color: var(--sub); }
  .row { display: flex; gap: 10px; }
  .row .btn { margin-top: 0; }
  .big-score { font-size: 56px; font-weight: 800; text-align: center; margin: 8px 0 0; }
  .center { text-align: center; }
  .review-list { list-style: none; padding: 0; margin: 0; }
  .review-list li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .review-list li:last-child { border-bottom: 0; }
  .review-list .x { color: var(--ng); font-weight: 700; }
  .review-list .o { color: var(--ok); font-weight: 700; }
  .toggle { display: flex; gap: 6px; margin-top: 12px; }
  .toggle button { flex: 1; border: 2px solid var(--line); background: var(--card); color: var(--sub); border-radius: 10px; padding: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .toggle button.on { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .section-title { font-size: 15px; font-weight: 700; margin: 18px 0 10px; }
  .install { display: none; }
  .install.show { display: block; }
  .setting { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: 0; }
  .setting select, .setting button { font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--text); }
  .setting button.danger { color: var(--ng); border-color: var(--ng); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="data.js"></script>
<script>
'use strict';
// ====== 保存データ ======
const KEY = 'chugaku-eigo-v1';
const DEFAULT = { grade: 1, answered: 0, correct: 0, days: [], miss: {}, theme: 'auto', dir: 'en2ja' };
let S = load();
function load() {
  try { return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEFAULT); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function applyTheme() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.theme);
}
applyTheme();

function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function record(key, ok) {
  S.answered++; if (ok) S.correct++;
  if (!S.days.includes(today())) { S.days.push(today()); if (S.days.length > 400) S.days.shift(); }
  if (ok) { if (S.miss[key]) { S.miss[key]--; if (S.miss[key] <= 0) delete S.miss[key]; } }
  else S.miss[key] = Math.min((S.miss[key] || 0) + 1, 3);
  save();
}

// ====== 音声 ======
function speak(text) {
  try {
    if (window.AndroidTTS && AndroidTTS.speak) { AndroidTTS.speak(text); return; }
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }

// ====== ユーティリティ ======
const $app = document.getElementById('app');
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function grades() { return S.grade === 0 ? [1, 2, 3] : [S.grade]; }
function gradeLabel(g) { return g === 0 ? '全学年' : '中' + g; }
function wordPool() { const out = []; grades().forEach(g => WORDS[g].forEach((w, i) => out.push({ g, i, en: w[0], ja: w[1] }))); return out; }
function header(title, back) {
  return `<header class="top">${back ? '<button class="iconbtn" data-act="home" aria-label="もどる">←</button>' : ''}<h1>${esc(title)}</h1>${back ? '' : '<button class="iconbtn" data-act="settings" aria-label="設定">⚙</button>'}</header>`;
}
const QUIZ_LEN = 10;

// ====== ホーム ======
function home() {
  stopSession();
  const rate = S.answered ? Math.round(S.correct / S.answered * 100) : 0;
  const missN = Object.keys(S.miss).length;
  $app.innerHTML = header('中学英語トレーニング') + `
    <div class="card">
      <div class="muted" style="margin-bottom:8px">学年をえらぶ</div>
      <div class="seg" id="grade">
        ${[1, 2, 3, 0].map(g => `<button data-g="${g}" class="${S.grade === g ? 'on' : ''}">${gradeLabel(g)}</button>`).join('')}
      </div>
    </div>
    <div class="modes">
      <button class="mode" data-act="word"><span class="ic">🔤</span><b>単語クイズ</b><span>4択で意味をこたえる</span></button>
      <button class="mode" data-act="flash"><span class="ic">🃏</span><b>単語カード</b><span>めくって覚える</span></button>
      <button class="mode" data-act="grammar"><span class="ic">📘</span><b>文法クイズ</b><span>空所に入る語をえらぶ</span></button>
      <button class="mode" data-act="order"><span class="ic">🧩</span><b>並べかえ</b><span>単語をタップして英文に</span></button>
    </div>
    <button class="btn ${missN ? '' : 'ghost'}" data-act="review" style="margin-bottom:14px">🔁 苦手を復習（${missN}問）</button>
    <div class="card stats">
      <div><b>${streak()}</b><span>連続学習日数</span></div>
      <div><b>${S.answered}</b><span>解いた問題</span></div>
      <div><b>${rate}%</b><span>正答率</span></div>
    </div>
    <div class="card install" id="install">
      <b>ホーム画面に追加</b>
      <div class="muted">アプリとしてインストールすると、オフラインでも使えます。</div>
      <button class="btn" id="installBtn">インストール</button>
    </div>`;
  document.getElementById('grade').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    S.grade = +b.dataset.g; save(); home();
  };
  if (deferredPrompt) {
    document.getElementById('install').classList.add('show');
    document.getElementById('installBtn').onclick = async () => {
      deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {}
      deferredPrompt = null; home();
    };
  }
}

// ====== セッション共通 ======
let session = null;
function stopSession() { session = null; }
function startSession(kind, items, title) {
  session = { kind, items, title, i: 0, score: 0, log: [] };
  renderQ();
}
function progressBar() {
  const p = session.i / session.items.length * 100;
  return `<div class="qhead"><span>${session.i + 1} / ${session.items.length}</span><span>正解 ${session.score}</span></div><div class="progress"><i style="width:${p}%"></i></div>`;
}
function renderQ() {
  if (session.i >= session.items.length) return result();
  const it = session.items[session.i];
  if (it.type === 'word') wordQ(it);
  else if (it.type === 'grammar') grammarQ(it);
  else orderQ(it);
}
function next() { session.i++; renderQ(); window.scrollTo(0, 0); }
function nextBtn() {
  const last = session.i + 1 >= session.items.length;
  return `<button class="btn" id="next" hidden>${last ? '結果を見る' : '次へ'}</button>`;
}
function showNext() { const n = document.getElementById('next'); n.hidden = false; n.onclick = next; n.focus(); }

// ====== 単語クイズ ======
function wordItems(pool) {
  return shuffle(pool).slice(0, QUIZ_LEN).map(w => ({ type: 'word', w }));
}
function startWord() {
  startSession('word', wordItems(wordPool()), '単語クイズ');
}
function wordQ(it) {
  const w = it.w, en2ja = S.dir === 'en2ja';
  const all = WORDS[w.g].map((x, i) => ({ en: x[0], ja: x[1], i }));
  const wrong = shuffle(all.filter(x => x.i !== w.i)).slice(0, 3);
  const opts = shuffle([{ en: w.en, ja: w.ja, ok: true }].concat(wrong));
  $app.innerHTML = header(session.title, true) + `<div class="card">
    ${progressBar()}
    <div class="center"><span class="tag">${gradeLabel(w.g)}・${en2ja ? '英→日' : '日→英'}</span></div>
    <div class="question ${en2ja ? 'en' : ''}">${esc(en2ja ? w.en : w.ja)}</div>
    ${en2ja ? '<button class="speak" id="say">🔊 発音を聞く</button>' : ''}
    <div class="choices">${opts.map((o, k) => `<button class="choice ${en2ja ? '' : 'en'}" data-k="${k}">${esc(en2ja ? o.ja : o.en)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    ${nextBtn()}
    <div class="toggle" id="dir">
      <button data-d="en2ja" class="${en2ja ? 'on' : ''}">英語 → 日本語</button>
      <button data-d="ja2en" class="${en2ja ? '' : 'on'}">日本語 → 英語</button>
    </div>
  </div>`;
  if (en2ja) { document.getElementById('say').onclick = () => speak(w.en); speak(w.en); }
  document.getElementById('dir').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.dataset.d === S.dir) return;
    S.dir = b.dataset.d; save(); renderQ();
  };
  bindChoices(opts, ok => {
    const key = 'w:' + w.g + ':' + w.i;
    record(key, ok);
    session.log.push({ ok, text: `${w.en} ＝ ${w.ja}` });
    const fb = document.getElementById('fb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.innerHTML = `<b>${ok ? '⭕ 正解！' : '❌ ざんねん'}</b><br>${esc(w.en)} ＝ ${esc(w.ja)}`;
    if (!en2ja) speak(w.en);
  });
}
function bindChoices(opts, done) {
  const btns = [...document.querySelectorAll('.choice')];
  btns.forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.k];
    btns.forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('ok'); });
    if (!o.ok) b.classList.add('ng'); else session.score++;
    done(!!o.ok);
    showNext();
  });
}

// ====== 文法クイズ ======
function startGrammar() {
  const pool = GRAMMAR.map((q, i) => ({ q, i })).filter(x => grades().includes(x.q.g));
  startSession('grammar', shuffle(pool).slice(0, QUIZ_LEN).map(x => ({ type: 'grammar', i: x.i })), '文法クイズ');
}
function grammarQ(it) {
  const q = GRAMMAR[it.i];
  const opts = shuffle(q.c.map((c, k) => ({ c, ok: k === 0 })));
  const qHtml = esc(q.q).replace('___', '<span style="border-bottom:3px solid var(--primary);padding:0 18px">&nbsp;</span>');
  $app.innerHTML = header(session.title, true) + `<div class="card">
    ${progressBar()}
    <div class="center"><span class="tag">${gradeLabel(q.g)}・${esc(q.t)}</span></div>
    <div class="question en small">${qHtml}</div>
    <div class="choices">${opts.map((o, k) => `<button class="choice en" data-k="${k}">${esc(o.c)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    ${nextBtn()}
  </div>`;
  bindChoices(opts, ok => {
    record('g:' + it.i, ok);
    const full = q.q.replace('___', q.c[0]);
    session.log.push({ ok, text: full });
    const fb = document.getElementById('fb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.innerHTML = `<b>${ok ? '⭕ 正解！' : '❌ ざんねん'}</b>　答え：<b>${esc(q.c[0])}</b><br>${esc(q.e)}<br><button class="speak" style="margin:8px 0 0" id="say">🔊 ${esc(full)}</button>`;
    document.getElementById('say').onclick = () => speak(full.replace(/ — /g, '. '));
  });
}

// ====== 並べかえ ======
function startOrder() {
  const pool = ORDER.map((q, i) => ({ q, i })).filter(x => grades().includes(x.q.g));
  startSession('order', shuffle(pool).slice(0, QUIZ_LEN).map(x => ({ type: 'order', i: x.i })), '並べかえ');
}
function orderQ(it) {
  const q = ORDER[it.i];
  const words = q.en.split(' ');
  let chips = words.map((w, k) => ({ w, k }));
  do { chips = shuffle(chips); } while (chips.length > 1 && chips.map(c => c.w).join(' ') === q.en);
  const placed = [];
  $app.innerHTML = header(session.title, true) + `<div class="card">
    ${progressBar()}
    <div class="center"><span class="tag">${gradeLabel(q.g)}・並べかえ</span></div>
    <div class="question small">${esc(q.ja)}</div>
    <div class="answer-box" id="ans"></div>
    <div class="pool" id="pool"></div>
    <div class="feedback" id="fb"></div>
    <div class="row" id="ctrl" style="margin-top:14px">
      <button class="btn ghost" id="clear">やり直す</button>
      <button class="btn" id="check" disabled>こたえ合わせ</button>
    </div>
    ${nextBtn()}
  </div>`;
  const $ans = document.getElementById('ans'), $pool = document.getElementById('pool'), $check = document.getElementById('check');
  let locked = false;
  function draw() {
    $ans.innerHTML = placed.map((c, n) => `<button class="chip placed" data-n="${n}">${esc(c.w)}</button>`).join('') +
      (placed.length === words.length ? `<span style="font-size:18px;align-self:center">${esc(q.p)}</span>` : '');
    $pool.innerHTML = chips.map((c, n) => placed.includes(c) ? '' : `<button class="chip" data-n="${n}">${esc(c.w)}</button>`).join('');
    $check.disabled = placed.length !== words.length;
  }
  $pool.onclick = e => { const b = e.target.closest('.chip'); if (!b || locked) return; placed.push(chips[+b.dataset.n]); draw(); };
  $ans.onclick = e => { const b = e.target.closest('.chip'); if (!b || locked) return; placed.splice(+b.dataset.n, 1); draw(); };
  document.getElementById('clear').onclick = () => { if (locked) return; placed.length = 0; draw(); };
  $check.onclick = () => {
    locked = true;
    const mine = placed.map(c => c.w).join(' ');
    const ok = mine === q.en;
    if (ok) session.score++;
    record('o:' + it.i, ok);
    const full = q.en + q.p;
    session.log.push({ ok, text: full });
    $ans.classList.add(ok ? 'ok' : 'ng');
    document.getElementById('ctrl').style.display = 'none';
    const fb = document.getElementById('fb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.innerHTML = `<b>${ok ? '⭕ 正解！' : '❌ ざんねん'}</b><br>正しい英文：<b>${esc(full)}</b><br><button class="speak" style="margin:8px 0 0" id="say">🔊 発音を聞く</button>`;
    document.getElementById('say').onclick = () => speak(full);
    speak(full);
    showNext();
  };
  draw();
}

// ====== 復習 ======
function startReview() {
  const keys = shuffle(Object.keys(S.miss)).slice(0, QUIZ_LEN);
  if (!keys.length) {
    $app.innerHTML = header('苦手を復習', true) + `<div class="card center"><div style="font-size:48px">🎉</div><b>苦手な問題はありません</b><p class="muted">クイズでまちがえた問題がここにたまります。</p><button class="btn" data-act="home">ホームへ</button></div>`;
    return;
  }
  const items = keys.map(k => {
    const p = k.split(':');
    if (p[0] === 'w') { const g = +p[1], i = +p[2]; const w = WORDS[g] && WORDS[g][i]; return w && { type: 'word', w: { g, i, en: w[0], ja: w[1] } }; }
    if (p[0] === 'g') return GRAMMAR[+p[1]] && { type: 'grammar', i: +p[1] };
    if (p[0] === 'o') return ORDER[+p[1]] && { type: 'order', i: +p[1] };
  }).filter(Boolean);
  startSession('review', items, '苦手を復習');
}

// ====== 結果 ======
function result() {
  const n = session.items.length, sc = session.score, pct = Math.round(sc / n * 100);
  const msg = pct === 100 ? 'パーフェクト！すばらしい！' : pct >= 80 ? 'よくできました！' : pct >= 50 ? 'その調子！' : '復習してもう一度チャレンジ！';
  const kind = session.kind;
  $app.innerHTML = header('結果', true) + `<div class="card center">
    <div class="muted">${esc(session.title)}</div>
    <div class="big-score">${sc} / ${n}</div>
    <div style="font-size:18px;font-weight:700;margin:6px 0 4px">${pct === 100 ? '🏆' : pct >= 80 ? '🌟' : '💪'} ${msg}</div>
  </div>
  <div class="card"><div class="section-title" style="margin-top:0">ふりかえり</div>
    <ul class="review-list">${session.log.map(l => `<li><span class="${l.ok ? 'o' : 'x'}">${l.ok ? '○' : '×'}</span>　${esc(l.text)}</li>`).join('')}</ul>
  </div>
  <button class="btn" id="again">もう一度</button>
  <button class="btn ghost" data-act="home">ホームへ</button>`;
  document.getElementById('again').onclick = () => ({ word: startWord, grammar: startGrammar, order: startOrder, review: startReview })[kind]();
}

// ====== 単語カード ======
function flash(order, pos) {
  stopSession();
  order = order || shuffle(wordPool()); pos = pos || 0;
  const w = order[pos];
  const known = !S.miss['w:' + w.g + ':' + w.i];
  $app.innerHTML = header('単語カード', true) + `
    <div class="qhead"><span>${pos + 1} / ${order.length}</span><span class="tag">${gradeLabel(w.g)}</span></div>
    <div class="flash" id="card"><div class="flash-inner">
      <div class="face"><div class="w">${esc(w.en)}</div><div class="hint">タップして意味を見る</div></div>
      <div class="face back"><div class="w" style="font-size:28px">${esc(w.ja)}</div><div class="muted" style="margin-top:8px">${esc(w.en)}</div><div class="hint">タップでもどる</div></div>
    </div></div>
    <button class="speak" id="say">🔊 発音を聞く</button>
    <div class="row">
      <button class="btn ghost" id="bad">😣 まだ</button>
      <button class="btn" id="good">😊 覚えた</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="prev" ${pos === 0 ? 'disabled' : ''}>← 前へ</button>
      <button class="btn ghost" id="skip">次へ →</button>
    </div>
    <p class="muted center">「まだ」にした単語は「苦手を復習」に入ります。${known ? '' : '<br>（この単語は苦手リストに入っています）'}</p>`;
  const card = document.getElementById('card');
  card.onclick = () => card.classList.toggle('flipped');
  document.getElementById('say').onclick = () => speak(w.en);
  const go = d => { const p = pos + d; if (p < 0) return; if (p >= order.length) return flash(shuffle(order), 0); flash(order, p); };
  const key = 'w:' + w.g + ':' + w.i;
  document.getElementById('good').onclick = () => { delete S.miss[key]; save(); go(1); };
  document.getElementById('bad').onclick = () => { S.miss[key] = Math.max(S.miss[key] || 0, 2); save(); go(1); };
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('skip').onclick = () => go(1);
  speak(w.en);
}

// ====== 設定 ======
function settings() {
  stopSession();
  $app.innerHTML = header('設定', true) + `<div class="card">
    <div class="setting"><span>画面のテーマ</span>
      <select id="theme">
        <option value="auto">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option>
      </select></div>
    <div class="setting"><span>発音テスト</span><button id="test">🔊 Hello!</button></div>
    <div class="setting"><span>学習記録をリセット</span><button class="danger" id="reset">リセット</button></div>
  </div>
  <p class="muted center">収録：単語 ${WORDS[1].length + WORDS[2].length + WORDS[3].length} 語 ／ 文法 ${GRAMMAR.length} 問 ／ 並べかえ ${ORDER.length} 問</p>`;
  const t = document.getElementById('theme'); t.value = S.theme;
  t.onchange = () => { S.theme = t.value; save(); applyTheme(); };
  document.getElementById('test').onclick = () => speak('Hello! Nice to meet you.');
  document.getElementById('reset').onclick = () => {
    if (!confirm('学習記録（正答数・苦手リスト）をすべて消しますか？')) return;
    S = Object.assign({}, DEFAULT, { grade: S.grade, theme: S.theme, dir: S.dir }); save(); home();
  };
}

// ====== ナビゲーション ======
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') {
    if (session && session.i > 0 && session.i < session.items.length && !confirm('とちゅうでやめますか？')) return;
    home();
  }
  else if (a === 'word') startWord();
  else if (a === 'flash') flash();
  else if (a === 'grammar') startGrammar();
  else if (a === 'order') startOrder();
  else if (a === 'review') startReview();
  else if (a === 'settings') settings();
});

// Android の戻るボタン（WebView 版）から呼ばれる
window.onAndroidBack = function () {
  if (document.querySelector('[data-act="home"]')) { home(); return true; }
  return false;
};

// ====== PWA ======
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  const box = document.getElementById('install'); if (box) home();
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

home();
</script>
</body>
</html>
