<script>
'use strict';
// ================= 基本設定 =================
const T = 8, W = 40, H = 22, VW = W * T, VH = H * T;
let S = 4, needRebuild = false;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
// 画面の実解像度（devicePixelRatio込み）に合わせて描画解像度を決める → くっきり表示
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
  const ns = Math.max(3, Math.min(8, Math.ceil(s * dpr)));
  if (ns !== S || !cv.width || cv.width !== VW * ns) { S = ns; cv.width = VW * S; cv.height = VH * S; needRebuild = true; }
}
addEventListener('resize', fit); fit();
if ('ontouchstart' in window || matchMedia('(pointer:coarse)').matches) document.getElementById('touch').style.display = 'flex';

// ================= サウンド =================
let ac = null, master = null, sfxBus = null, musicBus = null, muted = false;
function initAudio() {
  if (ac) { try { ac.resume(); } catch (e) {} return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = .55;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3400;
    musicBus.connect(lp); lp.connect(master);
    const dl = ac.createDelay(); dl.delayTime.value = .375;
    const fb = ac.createGain(); fb.gain.value = .38; const wet = ac.createGain(); wet.gain.value = .35;
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { ac = null; }
}
function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 1, ac.currentTime, .05); }
document.addEventListener('visibilitychange', () => { if (!ac) return; try { document.hidden ? ac.suspend() : ac.resume(); } catch (e) {} });
function beep(f, d, type, vol, slide) {
  if (muted || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), ac.currentTime + d);
    g.gain.setValueAtTime(vol || .05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(sfxBus); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---- BGM（WebAudioでその場生成。コード進行はエリアごとに変化、後半ほど厚くなる） ----
let noiseBuf = null, musicTimer = null, mNext = 0, mStep = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PROGS = [
  [[57, 1], [53, 0], [48, 0], [55, 0]],   // Am F C G   （麓：静か）
  [[50, 1], [46, 0], [53, 0], [48, 0]],   // Dm Bb F C  （中腹：切ない）
  [[52, 1], [48, 0], [55, 0], [50, 0]],   // Em C G D   （山頂へ：明るい）
];
function mnote(f, t, dur, type, vol, atk, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest || musicBus); o.start(t); o.stop(t + dur + .05);
}
function mnoise(t, dur, vol, hp) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(musicBus); s.start(t); s.stop(t + dur);
}
function mkick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + .12);
  g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + .2);
}
const SCALE = [0, 3, 5, 7, 10, 12, 15], MELS = {};
function schedStep(idx, t) {
  const area = mode === 'title' ? 0 : Math.min(2, Math.floor(roomIdx / 6));
  const inten = mode === 'title' ? 0 : Math.min(3, Math.floor(roomIdx / 4));
  const bar = Math.floor(idx / 8), st = idx % 8, prog = PROGS[area];
  const [root, minor] = prog[bar % 4];
  const tri = [root, root + (minor ? 3 : 4), root + 7];
  const sd = 60 / 100 / 2;
  if (st === 0) { // パッド
    for (const n of tri) { mnote(mtof(n), t, sd * 8, 'sine', .07, .5); mnote(mtof(n + 12) * 1.004, t, sd * 8, 'triangle', .03, .8); }
    let b = root - 12; if (b < 40) b += 12;
    mnote(mtof(b), t, sd * 3.6, 'triangle', .16, .02);
    mnote(mtof(b), t + sd * 4, sd * 3.6, 'triangle', .13, .02);
  }
  // アルペジオ
  const arp = [0, 1, 2, 1, 3, 2, 1, 2][st];
  const an = arp === 3 ? tri[0] + 12 : tri[arp] + 12;
  mnote(mtof(an), t, sd * 1.6, 'square', .022 + inten * .004, .01);
  // メロディ（2小節ごとに決定的に生成）
  const mkey = (bar >> 1) + ':' + area;
  let mel = MELS[mkey];
  if (!mel) {
    let r = ((bar >> 1) * 7919 + area * 131 + 7) % 233280; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    let deg = 2; mel = [];
    for (let i = 0; i < 16; i++) { if (rnd() < (i % 4 === 0 ? .85 : .42)) { deg = Math.max(0, Math.min(SCALE.length - 1, deg + Math.floor(rnd() * 3) - 1)); mel.push(deg); } else mel.push(null); }
    MELS[mkey] = mel;
  }
  const md = mel[(bar % 2) * 8 + st];
  if (md !== null) mnote(mtof(root + 24 + SCALE[md] - (minor ? 0 : 3)), t, sd * 2.4, 'triangle', .07, .015);
  // ドラム
  if (inten >= 1) { if (st === 0 || st === 4) mkick(t); if (st % 2 === 1) mnoise(t, .05, .03 + inten * .008, 7000); }
  if (inten >= 2 && st === 2 || inten >= 2 && st === 6) mnoise(t, .12, .06, 1800);
}
function startMusic() {
  if (musicTimer) return;
  mNext = ac.currentTime + .1; mStep = 0;
  musicTimer = setInterval(() => {
    if (!ac || ac.state !== 'running') { if (ac) mNext = Math.max(mNext, ac.currentTime); return; }
    while (mNext < ac.currentTime + .3) { schedStep(mStep, mNext); mNext += 60 / 100 / 2; mStep++; }
  }, 80);
}
const sfx = {

  wall: () => beep(260, .1, 'square', .04, 200),
  dash: () => beep(500, .18, 'sawtooth', .05, -380),
  die: () => beep(300, .4, 'sawtooth', .07, -260),

  clear: () => { beep(523, .12, 'square', .05); setTimeout(() => beep(784, .2, 'square', .05), 110); },
  crumble: () => beep(120, .15, 'sawtooth', .04, -60),

function press(k) {
  initAudio();

  inp[k] = 1; inp.anyP = 1;
}
function release(k) { inp[k] = 0; }
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { setMuted(!muted); return; }
  if (e.code === 'KeyR' && mode === 'play') { killPlayer(); return; }
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); if (!e.repeat) press(k); }
  else if (!e.repeat) { initAudio(); inp.anyP = 1; }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });
addEventListener('blur', () => { for (const k of ['left', 'right', 'up', 'down', 'jump', 'dash', 'grab']) inp[k] = 0; });
const ptrs = new Map();
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, b); b.classList.add('on'); press(b.dataset.k); });
  const up = e => { const bb = ptrs.get(e.pointerId); if (bb) { bb.classList.remove('on'); release(bb.dataset.k); ptrs.delete(e.pointerId); } };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});
cv.addEventListener('pointerdown', () => { initAudio(); inp.anyP = 1; });

// ================= ステージ =================
// 座標はすべてタイル単位。b.box=壁 / spike=トゲ(向き U D L R) / crumble=崩れる床 / crystal=ダッシュ回復 / berry=イチゴ
function roomBuilder() {
  const b = { grid: new Uint8Array(W * H), spikes: [], crumbles: [], crystals: [], berries: [] };
  b.box = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && i < W && j >= 0 && j < H) b.grid[j * W + i] = 1; };
  b.carve = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && i < W && j >= 0 && j < H) b.grid[j * W + i] = 0; };
  b.spike = (x, y, d, n) => { for (let i = 0; i < (n || 1); i++) b.spikes.push({ x: x + (d === 'U' || d === 'D' ? i : 0), y: y + (d === 'L' || d === 'R' ? i : 0), d }); };
  b.crumble = (x, y) => b.crumbles.push({ tx: x, ty: y, s: 0, t: 0 });
  b.crystal = (x, y) => b.crystals.push({ x: x * T, y: y * T, t: 0 });
  b.berry = (x, y) => b.berries.push({ x: x * T, y: y * T, carry: false, done: false });
  return b;
}

// ================= ゲーム状態 =================
let mode = 'title'; // title | play | end
let roomIdx = 0, R = null, roomCanvas = null;
let deaths = 0, time = 0, berriesGot = 0, fade = 1, shake = 0, freeze = 0, flash = 0;
let particles = [], snow = [];
for (let i = 0; i < 60; i++) snow.push({ x: Math.random() * VW, y: Math.random() * VH, s: .5 + Math.random(), z: Math.random() });
const p = { x: 0, y: 0, w: 8, h: 11, rx: 0, ry: 0, vx: 0, vy: 0, face: 1, dashes: 1, stamina: 110, coyote: 0, jbuf: 0, dbuf: 0, varT: 0, varV: 0,
  forceT: 0, forceX: 0, state: 'n', dashT: 0, dashDir: { x: 1, y: 0 }, dashCd: 0, grabbing: false, noGrabT: 0, deadT: 0, hair: [], onGround: false };
const berriesDone = {};

function rectSolid(x, y, w, h) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 1) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 1) / T);
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) if (tileSolid(i, j)) return true;

  for (let i = 0; i < 60; i++) { const x = rnd() * VW, y = rnd() * VH * .5; const tw = .5 + .5 * Math.sin(time * 2 + i * 1.7); ctx.globalAlpha = Math.max(0, (1 - t * 1.2)) * (.35 + tw * .55); ctx.fillRect(Math.floor(x), Math.floor(y), i % 7 === 0 ? 1.5 : 1, i % 7 === 0 ? 1.5 : 1); }
  ctx.globalAlpha = 1;
  // オーロラ
  if (t < .75) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const gr = ctx.createLinearGradient(0, 10, 0, 90); gr.addColorStop(0, 'rgba(90,255,190,0)'); gr.addColorStop(.5, k % 2 ? 'rgba(120,140,255,.5)' : 'rgba(90,255,190,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = (.16 - t * .18) * (1 - k * .2); ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 90);
      for (let x = 0; x <= VW; x += 8) ctx.lineTo(x, 34 + k * 12 + Math.sin(x * .02 + time * .4 + k * 2) * 14 + Math.sin(x * .05 - time * .3) * 5);
      ctx.lineTo(VW, 90); ctx.lineTo(VW, 100); ctx.lineTo(0, 100); ctx.fill();
    }
    ctx.restore();
  }
  // 月 / 朝日
  const mx = 250 - t * 60, my = 34 + t * 60;
  glow(mx, my, 40, t > .6 ? 'rgba(255,200,120,1)' : 'rgba(200,220,255,1)', .5);
  ctx.fillStyle = t > .6 ? '#fff0c8' : '#f2f6ff'; ctx.beginPath(); ctx.arc(mx, my, 6, 0, 7); ctx.fill();
}
function text(str, x, y, size, col, align) {
  ctx.font = 'bold ' + size + 'px "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';

  ctx.fillStyle = col || '#fff'; ctx.fillText(str, x, y);
}
function drawPlayer() {
  if (p.state === 'dead') return;
  const x = Math.round(p.x), y = Math.round(p.y);
  const hc = p.dashes > 0 ? '#ff4d5e' : '#4dd0ff';
  for (let i = p.hair.length - 1; i >= 1; i--) { const h = p.hair[i], r = 3 - i * .55; ctx.fillStyle = hc; ctx.fillRect(Math.round(h.x - r), Math.round(h.y - r), Math.ceil(r * 2), Math.ceil(r * 2)); }
  const f = p.face;
  const run = p.onGround && Math.abs(p.vx) > 15, ph = Math.floor(time * 14) % 2;
  ctx.fillStyle = '#5a3a2a';
  if (!p.onGround && !p.grabbing) { ctx.fillRect(x + 1, y + 9, 2, 1); ctx.fillRect(x + 5, y + 9, 2, 1); }
  else if (run) { ctx.fillRect(x + (ph ? 0 : 1), y + 9, 3, 2); ctx.fillRect(x + (ph ? 5 : 4), y + 9, 3, 2); }
  else { ctx.fillRect(x + 1, y + 9, 2, 2); ctx.fillRect(x + 5, y + 9, 2, 2); }
  ctx.fillStyle = '#3a6fd8'; ctx.fillRect(x + 1, y + 6, 6, 4);
  ctx.fillStyle = '#2650a8'; ctx.fillRect(x + 1, y + 9, 6, 1);
  ctx.fillStyle = '#ffd0a8'; ctx.fillRect(x + 1, y + 2, 6, 4);
  ctx.fillStyle = hc; ctx.fillRect(x, y - 1, 8, 4); ctx.fillRect(f > 0 ? x : x + 5, y + 3, 3, 1);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + (f > 0 ? 4 : 2), y + 4, 2, 1);
  ctx.fillStyle = '#222'; ctx.fillRect(x + (f > 0 ? 5 : 2), y + 4, 1, 1);
  if (p.grabbing) { ctx.fillStyle = '#ffd0a8'; ctx.fillRect(f > 0 ? x + 6 : x, y + 3, 2, 2); }

}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (needRebuild && R) { needRebuild = false; renderRoom(); }
  drawBg();
  if (mode === 'title') { drawTitle(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * shake * 16), Math.round((Math.random() - .5) * shake * 16));
  ctx.drawImage(roomCanvas, 0, 0, VW, VH);
  for (const c of R.crumbles) {
    if (c.s === 2) continue;
    const x = c.tx * T + (c.s === 1 ? Math.round(Math.sin(time * 60) * .8) : 0), y = c.ty * T;
    ctx.fillStyle = c.s === 1 ? '#8a6a7a' : '#6d5a86'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#a58cc4'; ctx.fillRect(x, y, T, 2);
    ctx.fillStyle = '#4a3d63'; ctx.fillRect(x + 1, y + 4, 3, 1); ctx.fillRect(x + 4, y + 6, 3, 1); ctx.fillRect(x, y + 7, T, 1);
  }
  for (const c of R.crystals) {
    const x = c.x, y = c.y + Math.round(Math.sin(time * 4 + c.x) * 1);
    if (c.t > 0) { ctx.strokeStyle = 'rgba(125,255,176,.35)'; ctx.strokeRect(x + 1.5, y + 1.5, 5, 5); continue; }
    glow(x + 4, y + 4, 16, 'rgba(125,255,176,1)', .55 + .2 * Math.sin(time * 5));
    const cg = ctx.createLinearGradient(x, y, x + 8, y + 9); cg.addColorStop(0, '#eafff2'); cg.addColorStop(1, '#3fd48a');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(x + 4, y - 1.5); ctx.lineTo(x + 9, y + 4); ctx.lineTo(x + 4, y + 9.5); ctx.lineTo(x - 1, y + 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = .5; ctx.beginPath(); ctx.moveTo(x + 4, y - 1.5); ctx.lineTo(x + 4, y + 9.5); ctx.moveTo(x - 1, y + 4); ctx.lineTo(x + 9, y + 4); ctx.stroke();
  }
  for (const b of R.berries) {
    if (b.done) continue;
    const x = b.carry ? b.fx : b.x, y = (b.carry ? b.fy : b.y) + (b.carry ? 0 : Math.round(Math.sin(time * 3 + b.x) * 1.5));
    glow(x + 4, y + 4, 14, 'rgba(255,90,120,1)', .45);
    ctx.fillStyle = '#ff3b5c'; ctx.fillRect(Math.round(x) + 1, Math.round(y) + 2, 6, 5); ctx.fillRect(Math.round(x) + 2, Math.round(y) + 7, 4, 1);
    ctx.fillStyle = '#4ade80'; ctx.fillRect(Math.round(x) + 2, Math.round(y), 4, 2);
    ctx.fillStyle = '#ffd0d8'; ctx.fillRect(Math.round(x) + 2, Math.round(y) + 3, 1, 1); ctx.fillRect(Math.round(x) + 5, Math.round(y) + 5, 1, 1);
  }
  if (p.state !== 'dead') glow(p.x + 4, p.y + 5, 18, p.dashes > 0 ? 'rgba(255,90,110,1)' : 'rgba(90,200,255,1)', .22);
  drawPlayer();
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c;
    const s = q.trail ? q.s * (q.life / q.max) : q.s; ctx.fillRect(Math.round(q.x - s / 2), Math.round(q.y - s / 2), Math.max(1, Math.round(s)), Math.max(1, Math.round(s)));
  }
  ctx.globalAlpha = .7; ctx.fillStyle = '#fff';
  for (const s of snow) { ctx.beginPath(); ctx.arc(s.x, s.y, .5 + s.z * .6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * .45, VW / 2, VH / 2, VW * .62); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(5,8,25,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  // HUD
  text('ROOM ' + (roomIdx + 1) + '/' + ROOMS.length, 4, 3, 6);
  const tm = Math.floor(time), ts = String(Math.floor(tm / 60)).padStart(2, '0') + ':' + String(tm % 60).padStart(2, '0');
  text('🍓 ' + berriesGot + '   ☠ ' + deaths + '   ' + ts, VW - 4, 3, 6, '#fff', 'right');
  if (roomIdx < 6 || time < 1) { /* placeholder */ }
  if (R.def.hint) text(R.def.hint, VW / 2, VH - 10, 6, 'rgba(255,255,255,.8)', 'center');
  if (p.grabbing || p.stamina < 110 && !p.onGround) {
    if (p.stamina < 110) { const w = 12 * Math.max(0, p.stamina) / 110; ctx.fillStyle = p.stamina < 40 ? '#ffe14d' : '#7dffb0'; ctx.fillRect(Math.round(p.x - 2), Math.round(p.y - 7), Math.round(w), 1); }
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 6 + ')'; ctx.fillRect(0, 0, VW, VH); }

}
function drawTitle() {
  for (const s of snow) { ctx.globalAlpha = .7; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, .5 + s.z * .6, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  text('SUMMIT CLIMB', VW / 2, 34, 20, '#fff', 'center');
  text('サミットクライム ― 山頂をめざせ', VW / 2, 60, 8, '#ffd9c2', 'center');
  const y0 = 86;
  ['← → ↑ ↓　移動 / ダッシュの向き', 'C / Space　ジャンプ（壁ジャンプもできる）', 'X / J　ダッシュ（8方向）', 'Z / Shift　壁をつかんで登る（押している間）', 'R　やり直し　　M　音のオン・オフ'].forEach((l, i) => text(l, VW / 2, y0 + i * 11, 6.5, '#fff', 'center'));
  if (Math.floor(performance.now() / 500) % 2) text('C か Space か タップ でスタート', VW / 2, 150, 8, '#7dffb0', 'center');
  // 装飾キャラ
  const x = VW / 2 - 4, y = 22; void x; void y;
}
function drawEnd() {
  ctx.fillStyle = 'rgba(10,14,40,.7)'; ctx.fillRect(0, 0, VW, VH);
  text('頂上に到達！', VW / 2, 40, 18, '#ffe14d', 'center');
  const tm = Math.floor(time), ts = String(Math.floor(tm / 60)).padStart(2, '0') + ':' + String(tm % 60).padStart(2, '0');
  const total = ROOMS.reduce((a, r) => { const b = roomBuilder(); r.build(b); return a + b.berries.length; }, 0);
  text('🍓 ' + berriesGot + ' / ' + total, VW / 2, 78, 10, '#fff', 'center');
  text('☠ ' + deaths + ' 回　　⏱ ' + ts, VW / 2, 96, 10, '#fff', 'center');
  if (Math.floor(performance.now() / 500) % 2) text('C か Space か タップ でもう一度', VW / 2, 135, 8, '#7dffb0', 'center');

// ================= メインループ =================
function tick() {
  if (inp.anyP) {
    if (mode === 'title' && (inp.jumpP || inp.dashP || inp.anyP)) { mode = 'play'; deaths = 0; time = 0; berriesGot = 0; for (const k in berriesDone) delete berriesDone[k]; loadRoom(0); inp.jumpP = 0; inp.dashP = 0; initAudio(); }
    else if (mode === 'end') { mode = 'title'; inp.jumpP = 0; inp.dashP = 0; }
    inp.anyP = 0;
  }
}
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt;
  tick();
  let n = 0;
  while (acc >= 1 / 60 && n++ < 5) {
    acc -= 1 / 60;
    if (mode === 'play') {
      if (freeze > 0) { freeze -= 1 / 60; continue; }
      step(1 / 60);
    } else if (mode === 'title' || mode === 'end') {
      for (const s of snow) { s.y += (14 + s.z * 20) / 60; s.x += (10 + s.z * 12) / 60; if (s.y > VH) { s.y = -2; s.x = Math.random() * VW; } if (s.x > VW) s.x -= VW; }
    }
  }
  if (mode === 'play' || mode === 'end') { if (!R) loadRoom(0); }
  draw();
  requestAnimationFrame(frame);
}
loadRoom(0); mode = 'title';
requestAnimationFrame(frame);

// テスト用フック
window.__G = { step, inp, p, loadRoom, get mode() { return mode; }, set mode(v) { mode = v; }, get roomIdx() { return roomIdx; }, get R() { return R; } };
</script>
